name: Measure SG04 sprites

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/measure_sg04.yml"

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Measure SG04 alpha bounds
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path('assets/weapons/sg04')
          for path in sorted(root.glob('*.png')):
              im = Image.open(path).convert('RGBA')
              alpha = im.getchannel('A')
              bbox = alpha.getbbox()
              if bbox is None:
                  bbox = (0,0,0,0)
              x0,y0,x1,y1 = bbox
              anchor_x = (x0+x1)/2 - im.width/2
              anchor_y = y1 - im.height/2
              print(f'{path.name}|size={im.width}x{im.height}|bbox={bbox}|anchor=({anchor_x:.1f},{anchor_y:.1f})')
          PY
