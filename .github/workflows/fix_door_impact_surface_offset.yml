name: Fix Door Impact Surface Offset

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix_door_impact_surface_offset.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --ff-only origin main
      - name: Patch door surface impact offset
        run: |
          python - <<'PY'
          from pathlib import Path

          effect_path = Path('scripts/effects/hit_impact_v1.gd')
          effect = effect_path.read_text(encoding='utf-8')
          old = '''\tvar surface_offset := _world_surface_offset(anchor)\n'''
          new = '''\tvar surface_offset := _world_surface_offset(anchor, normal)\n'''
          assert old in effect, 'world surface offset call changed'
          effect = effect.replace(old, new, 1)

          old = '''static func _world_surface_offset(surface: Object) -> float:\n\tvar current := surface as Node\n\tvar depth := 0\n\twhile current != null and depth < 5:\n\t\tif current is AnimatableBody3D:\n\t\t\treturn MOVING_SURFACE_OFFSET\n\t\tcurrent = current.get_parent()\n\t\tdepth += 1\n\treturn WORLD_SURFACE_OFFSET\n'''
          new = '''static func _world_surface_offset(surface: Object, hit_normal: Vector3) -> float:\n\t# Önce yüzeye/prop'a özel offset çözümünü ara. Kapı gibi sprite ile\n\t# collider yüzeyi farklı olan hareketli objelerde tek sabit offset yanlış olur.\n\tvar current := surface as Node\n\tvar depth := 0\n\twhile current != null and depth < 8:\n\t\tif current.has_method("resolve_bullet_impact_offset"):\n\t\t\tvar resolved: Variant = current.call(\n\t\t\t\t"resolve_bullet_impact_offset",\n\t\t\t\tsurface,\n\t\t\t\thit_normal\n\t\t\t)\n\t\t\tif typeof(resolved) == TYPE_FLOAT or typeof(resolved) == TYPE_INT:\n\t\t\t\treturn maxf(0.001, float(resolved))\n\t\tcurrent = current.get_parent()\n\t\tdepth += 1\n\n\t# Özel resolver yoksa eski güvenli davranışı koru.\n\tcurrent = surface as Node\n\tdepth = 0\n\twhile current != null and depth < 5:\n\t\tif current is AnimatableBody3D:\n\t\t\treturn MOVING_SURFACE_OFFSET\n\t\tcurrent = current.get_parent()\n\t\tdepth += 1\n\treturn WORLD_SURFACE_OFFSET\n'''
          assert old in effect, 'world surface offset helper changed'
          effect = effect.replace(old, new, 1)
          effect_path.write_text(effect, encoding='utf-8')

          door_path = Path('scripts/props/door.gd')
          door = door_path.read_text(encoding='utf-8')
          old = '''signal lock_state_changed(is_locked: bool)\n\n'''
          new = '''signal lock_state_changed(is_locked: bool)\n\nconst BULLET_IMPACT_FACE_OFFSET := 0.052\nconst BULLET_IMPACT_EDGE_OFFSET := 0.004\n\n'''
          assert old in door, 'door constants anchor changed'
          door = door.replace(old, new, 1)

          anchor = '''func _bullet_impact_panel_for_position(hit_position: Vector3) -> Node3D:\n'''
          helper = '''func resolve_bullet_impact_offset(anchor: Node3D, hit_normal: Vector3) -> float:\n\tif anchor != door_panel and anchor != door_panel_right:\n\t\treturn 0.018\n\tif hit_normal.length_squared() <= 0.000001:\n\t\treturn BULLET_IMPACT_EDGE_OFFSET\n\n\t# DoorPanel collider kalınlığı X ekseninde 0.20 m, görünen ön/arka\n\t# Sprite3D düzlemleri ise X = +/-0.15 m'de. Ön/arka isabette yaklaşık\n\t# 5 cm telafi gerekir. Açık kapının görünen ince Y/Z kenarlarında ise\n\t# BoxMesh ile collider aynı yüzeydedir; yalnız z-fighting kadar offset ver.\n\tvar local_normal := anchor.global_transform.basis.inverse() * hit_normal.normalized()\n\tvar abs_x := absf(local_normal.x)\n\tvar abs_y := absf(local_normal.y)\n\tvar abs_z := absf(local_normal.z)\n\tif abs_x >= abs_y and abs_x >= abs_z:\n\t\treturn BULLET_IMPACT_FACE_OFFSET\n\treturn BULLET_IMPACT_EDGE_OFFSET\n\n\n'''
          assert anchor in door, 'door impact panel helper anchor changed'
          assert 'func resolve_bullet_impact_offset(' not in door
          door = door.replace(anchor, helper + anchor, 1)
          door_path.write_text(door, encoding='utf-8')

          audit_path = Path('tests/hit_impact_audit.py')
          audit = audit_path.read_text(encoding='utf-8')
          audit = audit.replace(
              '    "_world_surface_offset(anchor)",\n',
              '    "_world_surface_offset(anchor, normal)",\n'
              '    \'current.has_method("resolve_bullet_impact_offset")\',\n'
              '    \'"resolve_bullet_impact_offset",\',\n',
              1,
          )
          old = '''    "func _bullet_impact_panel_for_position(",\n    "left_distance := absf(local_hit.z - door_panel.position.z)",\n'''
          new = '''    "func resolve_bullet_impact_offset(",\n    "BULLET_IMPACT_FACE_OFFSET := 0.052",\n    "BULLET_IMPACT_EDGE_OFFSET := 0.004",\n    "anchor.global_transform.basis.inverse() * hit_normal.normalized()",\n    "if abs_x >= abs_y and abs_x >= abs_z:",\n    "func _bullet_impact_panel_for_position(",\n    "left_distance := absf(local_hit.z - door_panel.position.z)",\n'''
          assert old in audit, 'door audit block changed'
          audit = audit.replace(old, new, 1)
          audit_path.write_text(audit, encoding='utf-8')
          PY
      - name: Diff sanity
        run: git diff --check
      - name: Run hit impact audit
        run: python tests/hit_impact_audit.py
      - name: Install official Godot 4.7
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" "$GODOT_URL"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Verify Godot version
        run: godot --version | grep '^4.7'
      - name: Import project headlessly
        run: godot --headless --editor --path . --quit
      - name: Commit fix
        run: |
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add scripts/effects/hit_impact_v1.gd scripts/props/door.gd tests/hit_impact_audit.py
          git commit -m "fix: fit door impacts to struck face"
          git push origin HEAD:main
