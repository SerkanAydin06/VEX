name: Temporary Enemy Candidate Usage Scan

on:
  push:
    branches:
      - chatgpt/enemy-export-scan-20260903

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Inspect technical candidate usage
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            ranged_cover_reposition_refresh \
            search_path_attempts \
            patrol_reach_distance \
            investigation_reach_distance \
            detour_duration; do
            echo "===== $name ====="
            grep -RIn --exclude-dir=.git -- "$name" scripts tests scenes resources || true
          done
