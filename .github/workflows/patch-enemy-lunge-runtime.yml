name: Patch Enemy Lunge Runtime

on:
  push:
    branches: [refactor/enemy-lunge-runtime]
    paths:
      - '.github/workflows/patch-enemy-lunge-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refactor/enemy-lunge-runtime
      - name: Patch lunge runtime integration
        run: python3 tools/patch_enemy_lunge_runtime.py
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/actors/enemy_combat_runtime.gd scripts/actors/enemy_lunge_base.gd tests/enemy_attack_handoff_audit.py
          git commit -m "Integrate enemy lunge runtime"
          git push origin HEAD:refactor/enemy-lunge-runtime
