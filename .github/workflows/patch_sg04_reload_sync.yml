name: Patch SG04 Reload Sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch_sg04_reload_sync.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync SG04 reload visual and fire interrupt
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = 'scripts/player/weapon_controller.gd'
          replace_once(
              path,
              'var _sg04_reload_generation := 0\n',
              'var _sg04_reload_generation := 0\nvar _sg04_reload_fire_queued := false\n',
          )
          replace_once(
              path,
              '''\tvar wants_to_fire := Input.is_action_pressed("fire") if weapon.automatic else Input.is_action_just_pressed("fire")\n\tif is_reloading:\n''',
              '''\tvar wants_to_fire := Input.is_action_pressed("fire") if weapon.automatic else Input.is_action_just_pressed("fire")\n\tif _sg04_reload_fire_queued:\n\t\tif weapon.weapon_id != &"sg04":\n\t\t\t_sg04_reload_fire_queued = false\n\t\telif not is_reloading and _cooldown_remaining <= 0.0:\n\t\t\t_sg04_reload_fire_queued = false\n\t\t\t_try_fire()\n\t\t\treturn\n\tif is_reloading:\n''',
          )
          replace_once(
              path,
              '''\tis_reloading = true\n\t_sg04_reload_generation += 1\n''',
              '''\tis_reloading = true\n\t_sg04_reload_fire_queued = false\n\t_sg04_reload_generation += 1\n''',
          )
          replace_once(
              path,
              '''\t# Fire interval bitmediyse reload devam eder; ilk yasal ateş tıklaması anında keser.\n\tif _cooldown_remaining > 0.0:\n\t\treturn\n\t_sg04_reload_generation += 1\n\tis_reloading = false\n\t_try_fire()\n''',
              '''\t_sg04_reload_generation += 1\n\tis_reloading = false\n\t# Reload görselini anında bırak; ateş intervali bitmediyse aynı tıklamayı queue et.\n\t_play_hud_action(&"equip")\n\tif _cooldown_remaining > 0.0:\n\t\t_sg04_reload_fire_queued = true\n\t\treturn\n\t_sg04_reload_fire_queued = false\n\t_try_fire()\n''',
          )

          path = 'scenes/ui/weapons/sg04_view.tscn'
          p = Path(path)
          text = p.read_text(encoding='utf-8')
          old = '"speed": 2.7586207'
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'{path}: expected 3 reload speeds, found {count}')
          p.write_text(text.replace(old, '"speed": 5.5172414'), encoding='utf-8')

          path = 'tests/sg04_weapon_audit.py'
          p = Path(path)
          text = p.read_text(encoding='utf-8')
          anchor = "    require(view, 'autoplay = \"idle\"', \"idle autoplay\")\n"
          if anchor not in text:
              raise SystemExit('SG04 audit view anchor missing')
          text = text.replace(
              anchor,
              anchor + "    if view.count('\\\"speed\\\": 5.5172414') < 3:\n        ERRORS.append(\"SG04 2x reload SpriteFrames hızı üç reload animasyonuna uygulanmamış\")\n",
              1,
          )
          marker = "('func _interrupt_sg04_reload_and_fire()', \"ateşle reload kesme\"),"
          if marker not in text:
              raise SystemExit('SG04 audit interrupt marker missing')
          text = text.replace(
              marker,
              marker + "\n        ('_sg04_reload_fire_queued = true', \"cooldown sırasında ateş tıklaması queue\"),\n        ('_play_hud_action(&\"equip\")', \"reload görselini anında kesme\"),",
              1,
          )
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit SG04 reload sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/player/weapon_controller.gd scenes/ui/weapons/sg04_view.tscn tests/sg04_weapon_audit.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: sync SG04 fast reload animation and interrupt"
          git push origin HEAD:main
