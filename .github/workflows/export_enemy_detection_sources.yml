name: Apply Enemy Detection Tuning

on:
  push:
    branches:
      - tooling/enemy-detection-export

permissions:
  contents: write

jobs:
  apply-tuning:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: tooling/enemy-detection-export
          fetch-depth: 0
      - name: Apply patch to current main
        shell: bash
        run: |
          cp .github/enemy_detection_no_workflow.patch /tmp/enemy_detection.patch
          git fetch origin main
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "ed9b1e283bdda3cfea1ede03eff8c0183f9fa01b"
          git apply --check /tmp/enemy_detection.patch
          git apply /tmp/enemy_detection.patch
      - name: Validate detection tuning
        run: |
          python tests/enemy_detection_audit.py
          python tests/static_audit.py
          python tests/scene_syntax_audit.py
          python tests/level_test_audit.py
          python tests/player_movement_audit.py
          python tests/furnice_carrier_audit.py
          python tests/crucible_warden_audit.py
          python tests/sg04_weapon_audit.py
          python tests/weapon_ads_audit.py
      - name: Commit to main
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add scripts/actors/ravager.gd scripts/actors/redviper.gd scenes/actors/ravager.tscn scenes/actors/veilmaw.tscn scenes/actors/voidweaver.tscn scenes/actors/hellmagma.tscn scenes/actors/furnice_carrier.tscn scenes/actors/crucible_warden.tscn scenes/actors/redviper.tscn scenes/actors/badredviper.tscn scenes/actors/cinderhound.tscn tests/enemy_detection_audit.py
          git commit -m "tune: extend enemy detection ranges"
          git push origin HEAD:main
