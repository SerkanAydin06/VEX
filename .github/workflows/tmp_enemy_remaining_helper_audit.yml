name: Temporary Enemy Remaining Helper Audit

on:
  push:
    branches:
      - chatgpt/enemy-remaining-helper-audit-20260903

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Find crouched target-height dependency chain
        shell: bash
        run: |
          set -euo pipefail
          for symbol in \
            crouched_sight_target_height \
            crouched_target_height_scale \
            crouched_target_min_height \
            _get_crouched_sight_target_height; do
            echo "===== $symbol ====="
            grep -RIn --exclude-dir=.git -- "$symbol" scripts tests scenes resources || true
          done
