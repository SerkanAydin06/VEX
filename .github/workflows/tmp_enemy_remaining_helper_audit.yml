name: Temporary Enemy Dead Crouch Cleanup

on:
  push:
    branches:
      - chatgpt/enemy-remaining-helper-audit-20260903

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Apply dead crouched-height cleanup
        run: python tools/tmp_remove_dead_crouched_height.py
      - name: Verify dead orchestration is gone
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git -- '_get_crouched_sight_target_height\|crouched_target_height_scale\|crouched_target_min_height' scripts/actors/enemy_base.gd scripts/actors/enemy_combatant_base.gd scripts/actors/enemy_lunge_base.gd; then
            echo "::error::Dead crouched-height orchestration remains"
            exit 1
          fi
          grep -n 'static func crouched_sight_target_height' scripts/actors/enemy_perception_runtime.gd
          grep -n 'crouched_sight_target_height' tests/enemy_perception_runtime_test.gd
      - name: Run every Python audit
        shell: bash
        run: |
          status=0
          while IFS= read -r audit; do
            python "$audit" || status=1
          done < <(find tests -maxdepth 1 -name '*_audit.py' -print | sort)
          exit "$status"
      - name: Install official Godot 4.7
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" "$GODOT_URL"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Clean import and integrity
        shell: bash
        run: |
          set -o pipefail
          import_log="$RUNNER_TEMP/godot-import.log"
          godot --headless --editor --path . --quit 2>&1 | tee "$import_log"
          if grep -E 'ERROR:|invalid UID' "$import_log"; then exit 1; fi
          integrity_log="$RUNNER_TEMP/godot-integrity.log"
          godot --headless --path . tests/integrity_test.tscn 2>&1 | tee "$integrity_log"
          if grep -E 'ERROR:|invalid UID' "$integrity_log"; then exit 1; fi
      - name: Commit clean package
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/tmp_remove_dead_crouched_height.py .github/workflows/tmp_enemy_remaining_helper_audit.yml
          git config user.name "SerkanAydin06"
          git config user.email "srknydn88@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove dead enemy crouched height wrappers"
          git push origin HEAD:chatgpt/enemy-remaining-helper-audit-20260903
