name: Apply Enemy Common Safe Helpers

on:
  push:
    branches:
      - "refactor/enemy-common-safe-helpers"

permissions:
  contents: write

jobs:
  apply-refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Apply deterministic refactor
        run: python tools/apply_enemy_common_safe_helpers.py

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/actors/enemy_combatant_base.gd scripts/actors/enemy_lunge_base.gd tests/enemy_common_helper_architecture_audit.py
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Centralize safe enemy helpers"
          git push origin HEAD:refactor/enemy-common-safe-helpers
