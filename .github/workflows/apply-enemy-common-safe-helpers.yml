name: Apply Enemy Common Safe Helpers

on:
  push:
    branches: [refactor/enemy-common-safe-helpers]

permissions:
  contents: write

jobs:
  apply-refactor:
    if: github.event.head_commit.message == 'Apply temporary enemy helper refactor workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Apply deterministic helper refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("scripts/actors/enemy_combatant_base.gd"),
              Path("scripts/actors/enemy_lunge_base.gd"),
          ]

          reset_block = '''func _reset_search_probe() -> void:
          \t_search_probe_index = 0
          \t_search_probe_target = Vector3.ZERO
          \t_has_search_probe = false


          '''
          gravity_block = '''func _apply_gravity(delta: float) -> void:
          \tif not is_on_floor():
          \t\tvelocity.y -= _gravity * delta
          \telse:
          \t\tvelocity.y = floor_stick_velocity


          '''

          for path in paths:
              text = path.read_text(encoding="utf-8")
              if text.count(reset_block) != 1:
                  raise SystemExit(f"{path}: expected exactly one local _reset_search_probe block")
              if text.count(gravity_block) != 1:
                  raise SystemExit(f"{path}: expected exactly one local _apply_gravity block")
              gravity_call_count = text.count("_apply_gravity(delta)")
              if gravity_call_count < 2:
                  raise SystemExit(f"{path}: expected at least two _apply_gravity(delta) calls, got {gravity_call_count}")

              text = text.replace(reset_block, "")
              text = text.replace(gravity_block, "")
              text = text.replace(
                  "_apply_gravity(delta)",
                  "_apply_gravity(delta, floor_stick_velocity)",
              )
              path.write_text(text, encoding="utf-8")

          audit = Path("tests/enemy_common_helper_architecture_audit.py")
          audit.write_text('''from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
BASE = (ROOT / "scripts/actors/enemy_base.gd").read_text(encoding="utf-8")
COMBATANT = (ROOT / "scripts/actors/enemy_combatant_base.gd").read_text(encoding="utf-8")
LUNGE = (ROOT / "scripts/actors/enemy_lunge_base.gd").read_text(encoding="utf-8")

errors: list[str] = []

if "func _reset_search_probe() -> void:" not in BASE:
    errors.append("enemy_base.gd must own _reset_search_probe")
if "func _apply_gravity(delta: float, floor_stick_velocity_value: float) -> void:" not in BASE:
    errors.append("enemy_base.gd must own parameterized _apply_gravity")

for name, source in (("combatant", COMBATANT), ("lunge", LUNGE)):
    if "func _reset_search_probe() -> void:" in source:
        errors.append(f"{name} must not redeclare _reset_search_probe")
    if "func _apply_gravity(delta: float) -> void:" in source:
        errors.append(f"{name} must not redeclare _apply_gravity")
    if source.count("_apply_gravity(delta, floor_stick_velocity)") < 2:
        errors.append(f"{name} must route gravity through the shared parent helper")

if errors:
    raise SystemExit("\\n".join(errors))

print("Enemy common helper architecture audit passed")
''', encoding="utf-8")
          PY

      - name: Commit branch refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/actors/enemy_combatant_base.gd scripts/actors/enemy_lunge_base.gd tests/enemy_common_helper_architecture_audit.py
          git diff --cached --check
          git commit -m "Centralize safe enemy helpers"
          git push origin HEAD:refactor/enemy-common-safe-helpers
