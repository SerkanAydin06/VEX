name: Verify SG04 Shell Reload

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify_sg04_shell_reload.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate SG04 shell reload
        run: python tests/sg04_weapon_audit.py
      - name: Validate scene syntax
        run: python tests/scene_syntax_audit.py
