name: Apply enemy damage pursuit internal tuning patch

on:
  push:
    branches:
      - refactor/enemy-damage-pursuit-internal-tuning
    paths:
      - .github/workflows/temp_enemy_damage_pursuit_internal_patch.yml
      - .github/temp_apply_enemy_damage_pursuit_internal_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: refactor/enemy-damage-pursuit-internal-tuning
          fetch-depth: 0

      - name: Verify serialization and apply exact tuning patch
        run: python .github/temp_apply_enemy_damage_pursuit_internal_patch.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/actors/enemy_combatant_base.gd scripts/actors/enemy_lunge_base.gd
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "Internalize enemy damage pursuit tuning"
          git push origin HEAD:refactor/enemy-damage-pursuit-internal-tuning
