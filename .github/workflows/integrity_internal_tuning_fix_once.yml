name: Integrity Internal Tuning Fix Once

on:
  push:
    branches:
      - chatgpt/integrity-internal-tuning-contract-20260903

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Align integrity Inspector contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/integrity_test.gd')
          source = path.read_text(encoding='utf-8')
          old_common = '''const COMMON_CREATURE_INSPECTOR_PROPERTIES := [
          \t&"path_target_change_distance", &"runtime_grid_step", &"runtime_grid_max_nodes",
          \t&"runtime_grid_search_margin", &"sight_collision_mask", &"aggro_on_damage",
          \t&"damage_pursuit_min_progress", &"damage_pursuit_stall_timeout",
          \t&"damage_pursuit_commit_time", &"acoustic_collision_mask", &"acoustic_probe_height",
          \t&"loud_noise_alert_threshold", &"headshot_reference_height",
          \t&"visibility_vertical_span_scale", &"visibility_lateral_span_scale",
          \t&"crouched_target_height_scale", &"search_probe_diagonal_weight",
          ]
          '''
          new_common = '''const COMMON_CREATURE_INSPECTOR_PROPERTIES := [
          \t&"path_target_change_distance", &"runtime_grid_step", &"runtime_grid_max_nodes",
          \t&"runtime_grid_search_margin", &"sight_collision_mask", &"aggro_on_damage",
          \t&"damage_pursuit_min_progress", &"damage_pursuit_stall_timeout",
          \t&"damage_pursuit_commit_time", &"loud_noise_alert_threshold",
          \t&"headshot_reference_height",
          ]
          '''
          assert source.count(old_common) == 1
          source = source.replace(old_common, new_common, 1)
          ranged_line = '\t&"cover_visibility_score_weight",\n'
          assert source.count(ranged_line) == 1
          source = source.replace(ranged_line, '', 1)
          path.write_text(source, encoding='utf-8')

          workflow = Path('.github/workflows/integrity_internal_tuning_fix_once.yml')
          assert workflow.exists()
          workflow.unlink()
          PY
      - name: Run every Python audit
        shell: bash
        run: |
          status=0
          while IFS= read -r audit; do
            python "$audit" || status=1
          done < <(find tests -maxdepth 1 -name '*_audit.py' -print | sort)
          exit "$status"
      - name: Install official Godot 4.7
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" "$GODOT_URL"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Verify clean import and integrity scene
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          ! grep -E 'ERROR:|invalid UID' "$RUNNER_TEMP/import.log"
          godot --headless --path . tests/integrity_test.tscn 2>&1 | tee "$RUNNER_TEMP/integrity.log"
          ! grep -E 'ERROR:|invalid UID' "$RUNNER_TEMP/integrity.log"
      - name: Verify patch scope
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/integrity_internal_tuning_fix_once.yml' \
            'tests/integrity_test.gd' | sort)"
          test "$changed" = "$expected"
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align integrity test with internal enemy tuning"
          git push origin HEAD:${{ github.ref_name }}
