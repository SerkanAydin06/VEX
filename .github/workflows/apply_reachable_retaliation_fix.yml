name: Apply Reachable Retaliation Fix

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Patch reachable retaliation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ravager = Path('scripts/actors/ravager.gd')
          s = ravager.read_text(encoding='utf-8')

          old = '''\t\tif _source is Node3D:\n\t\t\tvar source_node := _source as Node3D\n\t\t\t_last_seen_position = _damage_source_approach_position(source_node.global_position)\n\t\t\t_has_last_seen_position = true\n'''
          new = '''\t\tif _source is Node3D:\n\t\t\tvar source_node := _source as Node3D\n\t\t\t# Gerçek ateş kaynağını sakla. Rota sistemi hedef fiziksel olarak\n\t\t\t# ulaşılamıyorsa ona en yakın ulaşılabilir noktayı kendisi çözer.\n\t\t\t_last_seen_position = source_node.global_position\n\t\t\t_last_seen_position.y = global_position.y\n\t\t\t_has_last_seen_position = true\n'''
          if old not in s:
              raise SystemExit('ravager damage source block not found')
          s = s.replace(old, new, 1)

          pattern = re.compile(r'''func _find_investigation_path\(\n\tgraph: AStar3D,\n\tstart_id: int,\n\tdestination: Vector3\n\) -> PackedVector3Array:\n.*?\n\nfunc _connect_endpoint_to_graph''', re.S)
          replacement = '''func _find_investigation_path(\n\tgraph: AStar3D,\n\tstart_id: int,\n\tdestination: Vector3\n) -> PackedVector3Array:\n\t# Hedef (özellikle oyuncunun duvar kenarındaki merkezi) doğrudan erişilemez\n\t# olabilir. Bu durumda hedefe düz görüş şartı aramak AI'ı boş rota ile dondurur.\n\t# Bunun yerine erişilebilir waypoint'lerden hedefe fiziksel olarak en çok\n\t# yaklaşılabilen noktayı bul. Eğer duvarın öbür tarafına dolaşan rota varsa\n\t# hedefe tamamen ulaşan aday doğal olarak kazanır.\n\tvar nearby_indices := _nearest_waypoint_indices(\n\t\tdestination,\n\t\tINF,\n\t\t_navigation_points.size()\n\t)\n\tvar best_path := PackedVector3Array()\n\tvar best_remaining_distance := INF\n\tvar reachable_candidates := 0\n\n\tfor point_index: int in nearby_indices:\n\t\tvar candidate_path := graph.get_point_path(start_id, point_index)\n\t\tif candidate_path.is_empty():\n\t\t\tcontinue\n\t\treachable_candidates += 1\n\t\tvar waypoint := _navigation_points[point_index]\n\t\tvar approach_point := _furthest_walkable_point_toward(waypoint, destination)\n\t\tvar remaining_distance := _horizontal_distance(approach_point, destination)\n\n\t\tif remaining_distance < best_remaining_distance:\n\t\t\tbest_remaining_distance = remaining_distance\n\t\t\tbest_path = candidate_path.duplicate()\n\t\t\tif (\n\t\t\t\tbest_path.is_empty()\n\t\t\t\tor _horizontal_distance(best_path[best_path.size() - 1], approach_point)\n\t\t\t\t> waypoint_reach_distance * 0.25\n\t\t\t):\n\t\t\t\tbest_path.append(approach_point)\n\n\t\tif best_remaining_distance <= waypoint_reach_distance * 0.25:\n\t\t\tbreak\n\t\tif reachable_candidates >= 16 and best_remaining_distance <= search_probe_radius * 1.5:\n\t\t\tbreak\n\n\treturn best_path\n\n\nfunc _furthest_walkable_point_toward(from_position: Vector3, destination: Vector3) -> Vector3:\n\tvar start := from_position\n\tstart.y = global_position.y\n\tvar target := destination\n\ttarget.y = global_position.y\n\tif _is_walk_segment_clear(start, target):\n\t\treturn target\n\n\tvar low := 0.0\n\tvar high := 1.0\n\tfor _step: int in range(8):\n\t\tvar middle := (low + high) * 0.5\n\t\tvar probe := start.lerp(target, middle)\n\t\tprobe.y = global_position.y\n\t\tif _is_walk_segment_clear(start, probe):\n\t\t\tlow = middle\n\t\telse:\n\t\t\thigh = middle\n\n\tvar result := start.lerp(target, low)\n\tresult.y = global_position.y\n\treturn result\n\n\nfunc _connect_endpoint_to_graph'''
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'investigation function replacement count={count}')
          ravager.write_text(s2, encoding='utf-8')

          warden = Path('scripts/actors/crucible_warden.gd')
          w = warden.read_text(encoding='utf-8')
          old_call = '_navigate_to(_warden_cover_advance_target(_player.global_position), delta)'
          if old_call in w:
              w = w.replace(old_call, '_navigate_to(_player.global_position, delta)', 1)
          w = re.sub(r'\n\nfunc _warden_cover_advance_target\(source_position: Vector3\) -> Vector3:\n.*?\n\nfunc _attempt_attack', '\n\nfunc _attempt_attack', w, count=1, flags=re.S)
          warden.write_text(w, encoding='utf-8')

          red = Path('scripts/actors/redviper.gd')
          r = red.read_text(encoding='utf-8')
          old_red = '''\t\tif retaliation_target != null and is_instance_valid(retaliation_target):\n\t\t\t_aggro = true\n\t\t\t_damage_reaction_remaining = damage_reaction_duration\n\t\t\t_last_seen_position = retaliation_target.global_position\n'''
          new_red = '''\t\tif retaliation_target != null and is_instance_valid(retaliation_target):\n\t\t\t_aggro = true\n\t\t\t_damage_reaction_remaining = damage_reaction_duration\n\t\t\t_last_seen_position = _retaliation_approach_position(retaliation_target.global_position)\n'''
          if old_red not in r:
              raise SystemExit('redviper retaliation block not found')
          r = r.replace(old_red, new_red, 1)
          marker = '\n\nfunc _collision_floor_local_y() -> float:\n'
          helper = '''\n\nfunc _retaliation_approach_position(source_position: Vector3) -> Vector3:\n\tvar flat_source := source_position\n\tflat_source.y = global_position.y\n\tvar toward_source := flat_source - global_position\n\ttoward_source.y = 0.0\n\tvar distance := toward_source.length()\n\tif distance <= 0.001:\n\t\treturn flat_source\n\n\tvar direction := toward_source / distance\n\tvar ray_start := global_position + Vector3.UP * maxf(0.55, sight_origin_height)\n\tvar ray_end := flat_source + Vector3.UP * maxf(0.45, sight_target_height)\n\tvar query := PhysicsRayQueryParameters3D.create(ray_start, ray_end, 1 | 8, [get_rid()])\n\tquery.collide_with_areas = false\n\tvar hit := get_world_3d().direct_space_state.intersect_ray(query)\n\tif hit.is_empty():\n\t\treturn flat_source\n\n\tvar hit_position: Vector3 = hit.get("position", flat_source)\n\tvar result := hit_position - direction * maxf(investigation_reach_distance + 0.45, 0.9)\n\tresult.y = global_position.y\n\treturn result\n'''
          if marker not in r:
              raise SystemExit('redviper helper marker not found')
          r = r.replace(marker, helper + marker, 1)
          red.write_text(r, encoding='utf-8')

          test = Path('tests/enemy_reachable_retaliation_audit.py')
          test.write_text('''from pathlib import Path\n\nravager = Path("scripts/actors/ravager.gd").read_text(encoding="utf-8")\nwarden = Path("scripts/actors/crucible_warden.gd").read_text(encoding="utf-8")\nred = Path("scripts/actors/redviper.gd").read_text(encoding="utf-8")\n\nassert "_last_seen_position = source_node.global_position" in ravager\nassert "func _furthest_walkable_point_toward" in ravager\nassert "var candidate_path := graph.get_point_path(start_id, point_index)" in ravager\nassert "remaining_distance := _horizontal_distance(approach_point, destination)" in ravager\nassert "_is_center_segment_clear(waypoint, destination)" not in ravager\nassert "_navigate_to(_player.global_position, delta)" in warden\nassert "func _warden_cover_advance_target" not in warden\nassert "_retaliation_approach_position(retaliation_target.global_position)" in red\nprint("Enemy reachable retaliation audit passed")\n''', encoding='utf-8')

          validate = Path('.github/workflows/validate.yml')
          v = validate.read_text(encoding='utf-8')
          step = '      - name: Validate reachable retaliation\n        run: python tests/enemy_reachable_retaliation_audit.py\n\n'
          if 'tests/enemy_reachable_retaliation_audit.py' not in v:
              anchor = '      - name: Validate enemy awareness\n'
              if anchor in v:
                  v = v.replace(anchor, step + anchor, 1)
              else:
                  anchor = '      - name: Import project headlessly\n'
                  if anchor not in v:
                      raise SystemExit('validate insertion anchor not found')
                  v = v.replace(anchor, step + anchor, 1)
              validate.write_text(v, encoding='utf-8')
          PY
      - name: Run reachable retaliation audit
        run: python tests/enemy_reachable_retaliation_audit.py
      - name: Install Godot 4.7
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q Godot_v4.7-stable_linux.x86_64.zip
          chmod +x Godot_v4.7-stable_linux.x86_64
      - name: Verify Godot
        run: ./Godot_v4.7-stable_linux.x86_64 --version
      - name: Import project
        run: ./Godot_v4.7-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Commit fix
        run: |
          git config user.name OpenAI
          git config user.email openai@users.noreply.github.com
          git add scripts/actors/ravager.gd scripts/actors/crucible_warden.gd scripts/actors/redviper.gd tests/enemy_reachable_retaliation_audit.py .github/workflows/validate.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: pursue nearest reachable retaliation point'
          git push origin HEAD:main
