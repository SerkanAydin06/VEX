name: Patch SG04 Combat

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch_sg04_combat.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply SG04 combat and HUD changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exact fragment once, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # WeaponDefinition: generic scene-authoritative tuning fields.
          path = "scripts/player/weapon_definition.gd"
          replace_once(
              path,
              '@export var world_pickup_texture: Texture2D\n@export var supports_ads_pose := false',
              '@export var world_pickup_texture: Texture2D\n@export_range(0.5, 3.0, 0.05) var hud_crosshair_scale_multiplier := 1.0\n@export var supports_ads_pose := false',
          )
          replace_once(
              path,
              '@export_enum("small_cross", "red_dot") var hud_ads_reticle_style := "small_cross"',
              '@export_enum("small_cross", "red_dot", "ring") var hud_ads_reticle_style := "small_cross"',
          )
          replace_once(
              path,
              '@export_range(0.0, 20.0, 0.1) var spread_degrees := 1.0\n@export_range(5.0, 200.0, 1.0) var maximum_range := 80.0',
              '@export_range(0.0, 20.0, 0.1) var spread_degrees := 1.0\n## ADS pellet/mermi dağılımı. 0 = tam merkez; shotgun gibi silahlar ADS’de de dağılım koruyabilir.\n@export_range(0.0, 1.0, 0.01) var ads_spread_multiplier := 0.0\n@export_range(5.0, 200.0, 1.0) var maximum_range := 80.0\n## End <= start ise mesafe hasar düşüşü devre dışıdır.\n@export_range(0.0, 200.0, 0.5) var damage_falloff_start_distance := 0.0\n@export_range(0.0, 200.0, 0.5) var damage_falloff_end_distance := 0.0\n@export_range(0.05, 1.0, 0.05) var damage_falloff_min_multiplier := 1.0',
          )

          # Weapon controller: interruptible shell reload and shotgun falloff/spread.
          path = "scripts/player/weapon_controller.gd"
          replace_once(
              path,
              'var _burst_reset_remaining := 0.0\n',
              'var _burst_reset_remaining := 0.0\nvar _sg04_reload_generation := 0\n',
          )
          replace_once(
              path,
              '''\tvar weapon := get_current_weapon()\n\tif weapon == null or is_reloading or Input.mouse_mode != Input.MOUSE_MODE_CAPTURED:\n\t\treturn\n\tvar wants_to_fire := Input.is_action_pressed("fire") if weapon.automatic else Input.is_action_just_pressed("fire")\n\tif wants_to_fire:\n\t\t_try_fire()\n''',
              '''\tvar weapon := get_current_weapon()\n\tif weapon == null or Input.mouse_mode != Input.MOUSE_MODE_CAPTURED:\n\t\treturn\n\tvar wants_to_fire := Input.is_action_pressed("fire") if weapon.automatic else Input.is_action_just_pressed("fire")\n\tif is_reloading:\n\t\tif weapon.weapon_id == &"sg04" and wants_to_fire:\n\t\t\t_interrupt_sg04_reload_and_fire()\n\t\treturn\n\tif wants_to_fire:\n\t\t_try_fire()\n''',
          )
          replace_once(
              path,
              '''\tis_reloading = true\n\tvar rounds_to_load := mini(magazine_size - starting_magazine, starting_reserve)\n''',
              '''\tis_reloading = true\n\t_sg04_reload_generation += 1\n\tvar reload_generation := _sg04_reload_generation\n\tvar rounds_to_load := mini(magazine_size - starting_magazine, starting_reserve)\n''',
          )
          replace_once(
              path,
              '''\t\t_play_hud_action(&"reload_shell")\n\t\tawait get_tree().create_timer(shell_cycle_duration).timeout\n\t\tif not is_inside_tree() or _player == null or _player.is_dead:\n''',
              '''\t\t_play_hud_action(&"reload_shell")\n\t\tawait get_tree().create_timer(shell_cycle_duration).timeout\n\t\tif reload_generation != _sg04_reload_generation:\n\t\t\treturn\n\t\tif not is_inside_tree() or _player == null or _player.is_dead:\n''',
          )
          replace_once(
              path,
              '''\t_play_hud_action(&"reload_finish")\n\tawait get_tree().create_timer(finish_duration).timeout\n\tif not is_inside_tree() or _player == null or _player.is_dead:\n''',
              '''\t_play_hud_action(&"reload_finish")\n\tawait get_tree().create_timer(finish_duration).timeout\n\tif reload_generation != _sg04_reload_generation:\n\t\treturn\n\tif not is_inside_tree() or _player == null or _player.is_dead:\n''',
          )
          replace_once(
              path,
              '''\tis_reloading = false\n\tbroadcast_state()\n\n\nfunc add_ammo''',
              '''\tis_reloading = false\n\tbroadcast_state()\n\n\nfunc _interrupt_sg04_reload_and_fire() -> void:\n\tvar weapon := get_current_weapon()\n\tif weapon == null or weapon.weapon_id != &"sg04" or not is_reloading:\n\t\treturn\n\t# Fire interval bitmediyse reload devam eder; ilk yasal ateş tıklaması anında keser.\n\tif _cooldown_remaining > 0.0:\n\t\treturn\n\t_sg04_reload_generation += 1\n\tis_reloading = false\n\t_try_fire()\n\n\nfunc add_ammo''',
          )
          replace_once(
              path,
              '''\tvar spread_tangent: float = tan(\n\t\tdeg_to_rad(weapon.spread_degrees * float(_modifiers(weapon).spread) * _player.get_weapon_spread_multiplier())\n\t)\n''',
              '''\tvar spread_multiplier := _player.get_weapon_spread_multiplier()\n\tif _player.is_aiming and weapon.supports_ads_pose:\n\t\tspread_multiplier = weapon.ads_spread_multiplier\n\tvar spread_tangent: float = tan(\n\t\tdeg_to_rad(weapon.spread_degrees * float(_modifiers(weapon).spread) * spread_multiplier)\n\t)\n''',
          )
          replace_once(
              path,
              '''\t\t\tvar pellet_damage := maxi(1, roundi(float(weapon.damage_per_pellet) * damage_multiplier))\n''',
              '''\t\t\tvar distance_damage_multiplier := _get_distance_damage_multiplier(\n\t\t\t\tweapon,\n\t\t\t\torigin.distance_to(hit_position)\n\t\t\t)\n\t\t\tvar pellet_damage := maxi(\n\t\t\t\t1,\n\t\t\t\troundi(float(weapon.damage_per_pellet) * damage_multiplier * distance_damage_multiplier)\n\t\t\t)\n''',
          )
          replace_once(
              path,
              '''\n\nfunc _resolve_damage_target(collider: Object) -> Node:\n''',
              '''\n\nfunc _get_distance_damage_multiplier(weapon: WeaponDefinition, distance: float) -> float:\n\tvar start := maxf(0.0, weapon.damage_falloff_start_distance)\n\tvar finish := maxf(0.0, weapon.damage_falloff_end_distance)\n\tif finish <= start or distance <= start:\n\t\treturn 1.0\n\tvar ratio := clampf((distance - start) / (finish - start), 0.0, 1.0)\n\treturn lerpf(1.0, weapon.damage_falloff_min_multiplier, ratio)\n\n\nfunc _resolve_damage_target(collider: Object) -> Node:\n''',
          )

          # HUD: SG04 hip crosshair scales around its true center.
          path = "scripts/ui/hud.gd"
          replace_once(
              path,
              'var _crosshair_rest_position := Vector2.ZERO\n',
              'var _crosshair_rest_position := Vector2.ZERO\nvar _crosshair_base_scale := Vector2.ONE\n',
          )
          replace_once(
              path,
              '''\t_crosshair_rest_position = crosshair.position\n\tcrosshair.texture = DOOM3_CROSSHAIR\n''',
              '''\t_crosshair_rest_position = crosshair.position\n\t_crosshair_base_scale = crosshair.scale\n\tcrosshair.pivot_offset = crosshair.size * 0.5\n\tcrosshair.texture = DOOM3_CROSSHAIR\n''',
          )
          replace_once(
              path,
              '''\tif definition != null:\n\t\tweapon_slot.text = tr(definition.hud_slot_label_key)\n\t\tammo_type.text = tr(definition.hud_ammo_label_key)\n\telse:\n\t\tweapon_slot.text = tr("HUD_SLOT_UNKNOWN")\n\t\tammo_type.text = tr("HUD_AMMUNITION")\n\tif _weapon_presenter != null:\n''',
              '''\tif definition != null:\n\t\tweapon_slot.text = tr(definition.hud_slot_label_key)\n\t\tammo_type.text = tr(definition.hud_ammo_label_key)\n\telse:\n\t\tweapon_slot.text = tr("HUD_SLOT_UNKNOWN")\n\t\tammo_type.text = tr("HUD_AMMUNITION")\n\t_apply_crosshair_weapon_scale(definition)\n\tif _weapon_presenter != null:\n''',
          )
          replace_once(
              path,
              '''\n\nfunc _on_ammo_changed(current: int, reserve: int) -> void:\n''',
              '''\n\nfunc _apply_crosshair_weapon_scale(definition: WeaponDefinition) -> void:\n\tvar multiplier := 1.0\n\tif definition != null:\n\t\tmultiplier = maxf(0.5, definition.hud_crosshair_scale_multiplier)\n\tcrosshair.scale = _crosshair_base_scale * multiplier\n\n\nfunc _on_ammo_changed(current: int, reserve: int) -> void:\n''',
          )

          # ADS reticle: add ring style.
          path = "scripts/ui/ads_reticle.gd"
          replace_once(
              path,
              '@export_range(1.5, 6.0, 0.1) var dot_outline_radius := 3.0\n@export_range(0.05, 1.0, 0.01) var feedback_duration := 0.24',
              '@export_range(1.5, 6.0, 0.1) var dot_outline_radius := 3.0\n@export_range(3.0, 11.0, 0.25) var ring_radius := 7.0\n@export_range(0.75, 3.0, 0.25) var ring_thickness := 1.5\n@export_range(0.05, 1.0, 0.01) var feedback_duration := 0.24',
          )
          replace_once(
              path,
              '''\tvar center := size * 0.5\n\tif _reticle_style == "red_dot":\n''',
              '''\tvar center := size * 0.5\n\tif _reticle_style == "ring":\n\t\tdraw_arc(center, ring_radius, 0.0, TAU, 48, shadow_color, ring_thickness + 2.0, true)\n\t\tdraw_arc(center, ring_radius, 0.0, TAU, 48, _display_color, ring_thickness, true)\n\t\treturn\n\tif _reticle_style == "red_dot":\n''',
          )

          path = "scenes/ui/ads_reticle.tscn"
          replace_once(
              path,
              'dot_outline_radius = 3.0\n',
              'dot_outline_radius = 3.0\nring_radius = 7.0\nring_thickness = 1.5\n',
          )

          # SG04 resource: preserve current visual tuning, change only requested combat fields.
          path = "resources/weapons/sg04.tres"
          replace_once(
              path,
              'world_pickup_texture = ExtResource("3_side")\nsupports_ads_pose = true',
              'world_pickup_texture = ExtResource("3_side")\nhud_crosshair_scale_multiplier = 2.0\nsupports_ads_pose = true',
          )
          replace_once(
              path,
              'hud_ads_scale_multiplier = 1.5\nhud_aim_fire_preserve_frame_motion = true',
              'hud_ads_scale_multiplier = 1.5\nhud_ads_reticle_style = "ring"\nhud_aim_fire_preserve_frame_motion = true',
          )
          replace_once(path, 'reload_duration = 1.45', 'reload_duration = 0.725')
          replace_once(
              path,
              'spread_degrees = 5.5\nmaximum_range = 48.0',
              'spread_degrees = 5.5\nads_spread_multiplier = 0.6\nmaximum_range = 48.0\ndamage_falloff_start_distance = 8.0\ndamage_falloff_end_distance = 30.0\ndamage_falloff_min_multiplier = 0.35',
          )

          # SG04 audit: preserve user-authored visual tuning, lock requested behavior.
          path = "tests/sg04_weapon_audit.py"
          text = Path(path).read_text(encoding="utf-8")
          text = text.replace(
              "('reload_duration =', \"reload duration tuning\"),",
              "('reload_duration = 0.725', \"2x reload hızı\"),\n        ('hud_crosshair_scale_multiplier = 2.0', \"2x hip crosshair\"),\n        ('hud_ads_reticle_style = \"ring\"', \"ADS halka reticle\"),\n        ('ads_spread_multiplier = 0.6', \"ADS shotgun spread\"),\n        ('damage_falloff_start_distance = 8.0', \"yakın tam hasar mesafesi\"),\n        ('damage_falloff_end_distance = 30.0', \"falloff bitiş mesafesi\"),\n        ('damage_falloff_min_multiplier = 0.35', \"uzak minimum pellet hasarı\"),",
              1,
          )
          marker = "('func get_reload_animation_speed_multiplier(', \"reload upgrade görsel hız senkronu\"),"
          if marker not in text:
              raise SystemExit("SG04 audit controller marker missing")
          text = text.replace(
              marker,
              marker + "\n        ('func _interrupt_sg04_reload_and_fire()', \"ateşle reload kesme\"),\n        ('_sg04_reload_generation += 1', \"async reload iptal tokeni\"),\n        ('spread_multiplier = weapon.ads_spread_multiplier', \"silah-bazlı ADS spread\"),\n        ('func _get_distance_damage_multiplier(', \"mesafe hasar düşüşü\"),",
              1,
          )
          Path(path).write_text(text, encoding="utf-8")

          # ADS audit: ring and weapon-specific ADS spread are valid generic contracts.
          path = "tests/weapon_ads_audit.py"
          text = Path(path).read_text(encoding="utf-8")
          old = '@export_enum("small_cross", "red_dot") var hud_ads_reticle_style := "small_cross"'
          new = '@export_enum("small_cross", "red_dot", "ring") var hud_ads_reticle_style := "small_cross"'
          if old not in text:
              raise SystemExit("weapon_ads_audit enum contract missing")
          text = text.replace(old, new, 1)
          anchor = '("camera.get_viewport().get_visible_rect().size * 0.5", "ADS için kamera ekran merkezi hesaplanmıyor"),'
          if anchor not in text:
              raise SystemExit("weapon_ads_audit controller anchor missing")
          text = text.replace(
              anchor,
              anchor + '\n        ("spread_multiplier = weapon.ads_spread_multiplier", "Silah-bazlı ADS spread override eksik"),',
              1,
          )
          ring_anchor = "('if _reticle_style == \"red_dot\"', \"ADS reticle optik red-dot stilini çizmiyor\"),"
          if ring_anchor not in text:
              raise SystemExit("weapon_ads_audit reticle anchor missing")
          text = text.replace(
              ring_anchor,
              "('if _reticle_style == \"ring\"', \"ADS reticle halka stilini çizmiyor\"),\n        (\"draw_arc(center, ring_radius\", \"ADS halka reticle çizimi eksik\"),\n        " + ring_anchor,
              1,
          )
          Path(path).write_text(text, encoding="utf-8")

          # Furnice audit was freezing scene defaults that Godot legitimately omitted after user edits.
          path = "tests/furnice_carrier_audit.py"
          text = Path(path).read_text(encoding="utf-8")
          for line in [
              '    require(carrier_scene, \'close_attack_threshold = 6.0\', "scene yakın menzil")\n',
              '    require(carrier_scene, \'projectile_muzzle_sprite_offset_pixels = Vector2(0, -139)\', "scene furnace ağzı muzzle offset")\n',
              '    require(carrier_scene, \'projectile_muzzle_depth_offset = 0.08\', "scene muzzle depth offset")\n',
          ]:
              if line not in text:
                  raise SystemExit(f"Furnice stale audit line missing: {line.strip()}")
              text = text.replace(line, "", 1)
          Path(path).write_text(text, encoding="utf-8")
          PY
      - name: Commit SG04 combat changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/player/weapon_definition.gd scripts/player/weapon_controller.gd scripts/ui/hud.gd scripts/ui/ads_reticle.gd scenes/ui/ads_reticle.tscn resources/weapons/sg04.tres tests/sg04_weapon_audit.py tests/weapon_ads_audit.py tests/furnice_carrier_audit.py
          git diff --cached --quiet && exit 0
          git commit -m "feat: refine SG04 reload spread falloff and reticles"
          git push origin HEAD:main
