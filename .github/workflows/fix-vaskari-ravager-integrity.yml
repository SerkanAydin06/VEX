name: Vaskari Ravager Integrity Fix

on:
  push:
    branches: [cleanup/vaskari-legacy-final]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("tests/integrity_test.gd"); s=p.read_text(); old="\t\t\tnot scene_path.ends_with(\"vaskari_raptor.tscn\")\n\t\t\tand not scene_path.ends_with(\"cinderhound.tscn\")"; new="\t\t\tnot scene_path.ends_with(\"vaskari_raptor.tscn\")\n\t\t\tand not scene_path.ends_with(\"vaskari_ravager.tscn\")\n\t\t\tand not scene_path.ends_with(\"cinderhound.tscn\")"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))'
          rm .github/workflows/fix-vaskari-ravager-integrity.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve Vaskari Ravager inspector contract"
          git push origin HEAD:cleanup/vaskari-legacy-final
