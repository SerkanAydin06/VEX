name: Patch Enemy Navigation Delegation

on:
  push:
    paths:
      - '.github/workflows/patch-enemy-navigation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch navigation runtime and combatant wrappers
        run: python3 tools/patch_enemy_navigation.py
      - name: Commit navigation delegation
        run: |
          git config user.name 'SerkanAydin06'
          git config user.email 'srknydn88@gmail.com'
          git add scripts/actors/enemy_navigation_runtime.gd scripts/actors/enemy_combatant_base.gd
          git commit -m 'Delegate combatant navigation geometry'
          git push origin HEAD:main
