name: Temporary Enemy Animation Helper Dedupe

on:
  push:
    branches:
      - chatgpt/enemy-animation-helper-dedupe-20260903

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Centralize common animation helpers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          base_path = Path("scripts/actors/enemy_base.gd")
          combatant_path = Path("scripts/actors/enemy_combatant_base.gd")
          lunge_path = Path("scripts/actors/enemy_lunge_base.gd")
          audit_path = Path("tests/enemy_script_architecture_audit.py")

          def remove_function(source: str, name: str) -> str:
              matches = list(re.finditer(r"(?m)^func\s+([A-Za-z0-9_]+)\b", source))
              target_index = next((i for i, match in enumerate(matches) if match.group(1) == name), None)
              assert target_index is not None, name
              start = matches[target_index].start()
              end = matches[target_index + 1].start() if target_index + 1 < len(matches) else len(source)
              while start > 0 and source[start - 1] == "\n":
                  start -= 1
                  if start == 0 or source[start - 1] != "\n":
                      break
              return source[:start] + "\n\n" + source[end:]

          base = base_path.read_text(encoding="utf-8")
          assert "func _has_animation(" not in base
          assert "func _get_animation_duration(" not in base
          marker = "func _horizontal_distance(first: Vector3, second: Vector3) -> float:\n"
          assert marker in base
          helper_lines = [
              "func _has_animation(animation_name: StringName) -> bool:",
              "\\treturn (",
              "\\t\\tanimated_sprite.sprite_frames != null",
              "\\t\\tand animated_sprite.sprite_frames.has_animation(animation_name)",
              "\\t\\tand animated_sprite.sprite_frames.get_frame_count(animation_name) > 0",
              "\\t)",
              "",
              "",
              "func _get_animation_duration(animation_name: StringName) -> float:",
              "\\tif animated_sprite.sprite_frames == null:",
              "\\t\\treturn 0.0",
              "\\tif not animated_sprite.sprite_frames.has_animation(animation_name):",
              "\\t\\treturn 0.0",
              "\\tvar frame_count := animated_sprite.sprite_frames.get_frame_count(animation_name)",
              "\\tif frame_count <= 0:",
              "\\t\\treturn 0.0",
              "\\tvar speed := animated_sprite.sprite_frames.get_animation_speed(animation_name)",
              "\\tif speed <= 0.001:",
              "\\t\\treturn 0.0",
              "\\treturn float(frame_count) / speed",
              "",
              "",
          ]
          common_helpers = "\n".join(helper_lines).replace("\\t", "\t")
          base = base.replace(marker, common_helpers + marker, 1)
          base_path.write_text(base, encoding="utf-8")

          for path in (combatant_path, lunge_path):
              source = path.read_text(encoding="utf-8")
              source = remove_function(source, "_has_animation")
              source = remove_function(source, "_get_animation_duration")
              path.write_text(source, encoding="utf-8")

          audit = audit_path.read_text(encoding="utf-8")
          anchor = 'assert enemy_base.count(\'@export_category("01B - Zorluk Çarpanları (Sahne)")\') == 1\n'
          assert anchor in audit
          addition_lines = [
              "",
              "",
              'for shared_animation_helper in ["_has_animation", "_get_animation_duration"]:',
              '    pattern = rf"(?m)^func {re.escape(shared_animation_helper)}\\\\b"',
              "    assert re.search(pattern, enemy_base), shared_animation_helper",
              '    assert not re.search(pattern, combatant_base), ("combatant duplicate", shared_animation_helper)',
              '    assert not re.search(pattern, lunge_base), ("lunge duplicate", shared_animation_helper)',
          ]
          addition = "\n".join(addition_lines) + "\n"
          audit = audit.replace(anchor, anchor + addition, 1)
          audit_path.write_text(audit, encoding="utf-8")
          PY
      - name: Run every Python audit
        shell: bash
        run: |
          status=0
          while IFS= read -r audit; do
            echo "::group::$audit"
            python "$audit" || status=1
            echo "::endgroup::"
          done < <(find tests -maxdepth 1 -name '*_audit.py' -print | sort)
          exit "$status"
      - name: Commit clean branch result
        shell: bash
        run: |
          rm .github/workflows/tmp_enemy_animation_helper_dedupe.yml
          git config user.name "SerkanAydin06"
          git config user.email "srknydn88@gmail.com"
          git add scripts/actors/enemy_base.gd scripts/actors/enemy_combatant_base.gd scripts/actors/enemy_lunge_base.gd tests/enemy_script_architecture_audit.py .github/workflows/tmp_enemy_animation_helper_dedupe.yml
          git commit -m "Centralize common enemy animation helpers"
          git push origin HEAD:chatgpt/enemy-animation-helper-dedupe-20260903
