name: Patch SG04 Shell Reload

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch_sg04_shell_reload.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve non-SG04 presenter behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/ui/hud_weapon_presenter.gd")
          text = path.read_text(encoding="utf-8")
          old = '''\tif sprite.sprite_frames != null and sprite.sprite_frames.has_animation(requested_animation):\n\t\tif action == &"fire":\n\t\t\tsprite.stop()\n\t\t\tsprite.frame = 0\n\t\t\tsprite.play(requested_animation)\n\t\telse:\n\t\t\tsprite.stop()\n\t\t\tsprite.frame = 0\n\t\t\tsprite.play(requested_animation, playback_speed)\n'''
          new = '''\tif sprite.sprite_frames != null and sprite.sprite_frames.has_animation(requested_animation):\n\t\tif action == &"fire":\n\t\t\tsprite.stop()\n\t\t\tsprite.frame = 0\n\t\t\tsprite.play(requested_animation)\n\t\telif action in [&"reload_shell", &"reload_finish"]:\n\t\t\tsprite.stop()\n\t\t\tsprite.frame = 0\n\t\t\tsprite.play(requested_animation, playback_speed)\n\t\telse:\n\t\t\tsprite.play(requested_animation)\n'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected presenter fragment once, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit presenter refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ui/hud_weapon_presenter.gd
          git diff --cached --quiet && exit 0
          git commit -m "fix: isolate SG04 reload presenter behavior"
          git push origin HEAD:main
