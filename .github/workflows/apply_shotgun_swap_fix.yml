name: Apply Shotgun Pickup Swap Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply_shotgun_swap_fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch physical weapon swap flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          player_path = Path('scripts/player/player.gd')
          player = player_path.read_text()
          old_pickup = '''\t\t&"p01", &"p07", &"p14", &"p20":\n\t\t\tif not _collect_sidearm_pickup(pickup_type, amount, source_pickup):\n\t\t\t\treturn false\n\t\t&"sg04":\n\t\t\tweapon_controller.call("unlock_weapon", &"sg04", amount)\n\t\t\tGameState.notify_pickup(tr("PICKUP_SHOTGUN_ACTIVE"), &"weapon")\n\t\t&"sg09":\n\t\t\tweapon_controller.call("unlock_weapon", &"sg09", amount)\n\t\t\tGameState.notify_pickup(tr("PICKUP_SHOTGUN_ACTIVE"), &"weapon")\n'''
          new_pickup = '''\t\t&"p01", &"p07", &"p14", &"p20", &"sg04", &"sg09":\n\t\t\tif not _collect_loadout_weapon_pickup(pickup_type, amount, source_pickup):\n\t\t\t\treturn false\n'''
          if old_pickup not in player:
              raise SystemExit('Expected SG04/SG09 legacy pickup block not found; refusing unsafe patch')
          player = player.replace(old_pickup, new_pickup, 1)
          player = player.replace('func _collect_sidearm_pickup(', 'func _collect_loadout_weapon_pickup(', 1)
          player = player.replace('_get_sidearm_drop_position(source_pickup)', '_get_weapon_drop_position(source_pickup)', 1)
          player = player.replace('"_spawn_dropped_sidearm_pickup",', '"_spawn_dropped_weapon_pickup",', 1)
          player = player.replace('func _get_sidearm_drop_position(', 'func _get_weapon_drop_position(', 1)
          player = player.replace('func _spawn_dropped_sidearm_pickup(', 'func _spawn_dropped_weapon_pickup(', 1)
          old_notice = '''\t\t&"p20":\n\t\t\tGameState.notify_pickup(tr("PICKUP_P20_ACTIVE"), &"weapon")\n\treturn true\n'''
          new_notice = '''\t\t&"p20":\n\t\t\tGameState.notify_pickup(tr("PICKUP_P20_ACTIVE"), &"weapon")\n\t\t&"sg04", &"sg09":\n\t\t\tGameState.notify_pickup(tr("PICKUP_SHOTGUN_ACTIVE"), &"weapon")\n\treturn true\n'''
          if old_notice not in player:
              raise SystemExit('Expected pickup notification block not found')
          player = player.replace(old_notice, new_notice, 1)
          player_path.write_text(player)

          audit_path = Path('tests/static_audit.py')
          audit = audit_path.read_text()
          old_audit = '''    if '&"sg09":' not in player_script or 'unlock_weapon", &"sg09"' not in player_script:\n        fail("Player SG-09 pickup toplama akışı eksik")\n'''
          new_audit = '''    for contract in [\n        '&"p01", &"p07", &"p14", &"p20", &"sg04", &"sg09":',\n        "func _collect_loadout_weapon_pickup(",\n        '\"equip_world_weapon\"',\n        '\"_spawn_dropped_weapon_pickup\"',\n        'displaced_weapon_id',\n    ]:\n        if contract not in player_script:\n            fail(f"Player fiziksel loadout silah swap sözleşmesi eksik: {contract}")\n    for obsolete in [\n        'unlock_weapon\", &\"sg04\"',\n        'unlock_weapon\", &\"sg09\"',\n        "func _collect_sidearm_pickup(",\n        '\"_spawn_dropped_sidearm_pickup\"',\n    ]:\n        if obsolete in player_script:\n            fail(f"Shotgun pickup eski kaybolan-silah akışını kullanıyor: {obsolete}")\n'''
          if old_audit not in audit:
              raise SystemExit('Expected SG09 static audit block not found')
          audit_path.write_text(audit.replace(old_audit, new_audit, 1))

          sg04_audit_path = Path('tests/sg04_weapon_audit.py')
          sg04_audit = sg04_audit_path.read_text()
          old_sg04_audit = '''    require(player_script, '&"sg04":', "player SG04 pickup handler")\n    require(player_script, 'unlock_weapon\", &\"sg04\"', "SG04 unlock çağrısı")\n'''
          new_sg04_audit = '''    require(\n        player_script,\n        '&"p01", &"p07", &"p14", &"p20", &"sg04", &"sg09":',\n        "player SG04/SG09 ortak fiziksel pickup handler",\n    )\n    require(player_script, 'func _collect_loadout_weapon_pickup(', "loadout pickup swap helper")\n    require(player_script, '\"equip_world_weapon\"', "loadout grup displacement çağrısı")\n    require(player_script, '\"_spawn_dropped_weapon_pickup\"', "yerinden çıkan shotgun pickup spawn")\n'''
          if old_sg04_audit not in sg04_audit:
              raise SystemExit('Expected SG04 legacy pickup audit block not found')
          sg04_audit_path.write_text(sg04_audit.replace(old_sg04_audit, new_sg04_audit, 1))

          integrity_path = Path('tests/integrity_test.gd')
          integrity = integrity_path.read_text()
          old_integrity = '''\tvar controller := FileAccess.get_file_as_string("res://scripts/player/weapon_controller.gd")\n\tfor contract in ["penetration_power", "target_limit", "_migrate_legacy_ammo_dictionary", "legacy_magnum_count"]:\n\t\tif contract not in controller:\n\t\t\tfailures.append("WeaponController P-20/save migration sözleşmesi eksik: %s" % contract)\n'''
          new_integrity = old_integrity + '''\tvar player_script := FileAccess.get_file_as_string("res://scripts/player/player.gd")\n\tfor contract in [\n\t\t'&"p01", &"p07", &"p14", &"p20", &"sg04", &"sg09":',\n\t\t"func _collect_loadout_weapon_pickup(",\n\t\t'"equip_world_weapon"',\n\t\t'"_spawn_dropped_weapon_pickup"',\n\t\t"displaced_weapon_id",\n\t]:\n\t\tif contract not in player_script:\n\t\t\tfailures.append("SG-04/SG-09 fiziksel swap sözleşmesi eksik: %s" % contract)\n\tfor obsolete in [\n\t\t'unlock_weapon", &"sg04"',\n\t\t'unlock_weapon", &"sg09"',\n\t\t"func _collect_sidearm_pickup(",\n\t\t'"_spawn_dropped_sidearm_pickup"',\n\t]:\n\t\tif obsolete in player_script:\n\t\t\tfailures.append("Shotgun pickup eski kaybolan-silah akışını kullanıyor: %s" % obsolete)\n'''
          if old_integrity not in integrity:
              raise SystemExit('Expected integrity weapon contract block not found')
          integrity_path.write_text(integrity.replace(old_integrity, new_integrity, 1))
          PY

          git diff --check

      - name: Validate patched contracts
        run: |
          python -m py_compile tests/static_audit.py tests/sg04_weapon_audit.py
          python tests/static_audit.py
          python tests/scene_syntax_audit.py
          python tests/level_test_audit.py
          python tests/sg04_weapon_audit.py
          python tests/weapon_ads_audit.py

      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add scripts/player/player.gd tests/static_audit.py tests/sg04_weapon_audit.py tests/integrity_test.gd
          git commit -m "fix: preserve shotgun pickup swaps"
          git push origin HEAD:main
