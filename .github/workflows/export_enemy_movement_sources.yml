name: Export Enemy Movement Sources

on:
  push:
    branches:
      - tooling/enemy-movement-export

permissions:
  contents: read

jobs:
  export-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Package movement sources
        uses: actions/upload-artifact@v4
        with:
          name: enemy-movement-sources
          if-no-files-found: error
          retention-days: 1
          path: |
            scripts/actors/ravager.gd
            scripts/actors/redviper.gd
            scripts/actors/crucible_warden.gd
            scripts/actors/enemy_runtime_utils.gd
