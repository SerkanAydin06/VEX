name: Apply enemy common contract patch

on:
  push:
    branches:
      - refactor/enemy-common-contract-exports
    paths:
      - .github/workflows/temp_enemy_common_contract_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/enemy-common-contract-exports
          fetch-depth: 0

      - name: Apply exact contract patch
        run: python .github/temp_apply_enemy_common_contract_patch.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/actors/enemy_base.gd scripts/actors/enemy_combatant_base.gd scripts/actors/enemy_lunge_base.gd tests/enemy_common_contract_architecture_audit.py
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "Centralize common enemy contract"
          git push origin HEAD:refactor/enemy-common-contract-exports
