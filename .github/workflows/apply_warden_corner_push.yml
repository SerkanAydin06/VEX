name: Apply Warden Corner Push

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply_warden_corner_push.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Patch Crucible Warden
        run: |
          echo '' | base64 -d > /tmp/patch_warden.py
          python /tmp/patch_warden.py
      - name: Validate Warden contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('scripts/actors/crucible_warden.gd').read_text(encoding='utf-8')
          assert 'func _update_behavior(delta: float) -> void:' in s
          assert 'visibility_ratio < 0.85' in s
          assert 'func _warden_cover_advance_target' in s
          assert 'near_side + side * side_distance' in s
          assert '_navigate_to(_warden_cover_advance_target' in s
          print('Crucible Warden corner push contract passed')
          PY
      - name: Install Godot 4.7
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q Godot_v4.7-stable_linux.x86_64.zip
          chmod +x Godot_v4.7-stable_linux.x86_64
      - name: Verify Godot
        run: ./Godot_v4.7-stable_linux.x86_64 --version
      - name: Import project
        run: ./Godot_v4.7-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Commit fix
        run: |
          git config user.name OpenAI
          git config user.email openai@users.noreply.github.com
          git add scripts/actors/crucible_warden.gd
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make crucible warden push cover edges'
          git push origin HEAD:main
