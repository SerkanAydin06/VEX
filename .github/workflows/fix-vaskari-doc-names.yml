name: Fix Vaskari document names

on:
  push:
    branches:
      - chore/finish-vaskari-rename

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize display names and run rename audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          for relative in ("Enemies_VEX.md", "STANDART.txt", "Story_VEX.md"):
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              updated = text.replace("VaskariRaptor", "Vaskari Raptor")
              updated = updated.replace("VaskariRavager", "Vaskari Ravager")
              if updated != text:
                  path.write_text(updated, encoding="utf-8", newline="")
                  print(f"normalized display names: {relative}")
          PY
          python3 tests/vaskari_raptor_rename_audit.py
          git diff --check
          git add Enemies_VEX.md STANDART.txt Story_VEX.md
          git diff --cached --quiet && { echo "No document normalization needed"; exit 1; }
          git commit -m "Normalize Vaskari display names"
          git push origin HEAD
