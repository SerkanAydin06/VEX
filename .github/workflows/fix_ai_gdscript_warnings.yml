name: Fix AI GDScript Warnings

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix_ai_gdscript_warnings.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Fix warnings
        run: |
          python - <<'PY'
          from pathlib import Path

          ravager = Path('scripts/actors/ravager.gd')
          r = ravager.read_text(encoding='utf-8')
          old_parent = '\t\tvar parent := (index - 1) / 2\n'
          new_parent = '\t\tvar parent: int = floori(float(index - 1) / 2.0)\n'
          if old_parent not in r:
              raise SystemExit('integer division line not found')
          r = r.replace(old_parent, new_parent, 1)
          ravager.write_text(r, encoding='utf-8')

          warden = Path('scripts/actors/crucible_warden.gd')
          w = warden.read_text(encoding='utf-8')
          old_scale = '\t\tvar scale := maximum_speed / horizontal_speed\n\t\tvelocity.x *= scale\n\t\tvelocity.z *= scale\n'
          new_scale = '\t\tvar velocity_scale := maximum_speed / horizontal_speed\n\t\tvelocity.x *= velocity_scale\n\t\tvelocity.z *= velocity_scale\n'
          if old_scale not in w:
              raise SystemExit('warden scale block not found')
          w = w.replace(old_scale, new_scale, 1)
          warden.write_text(w, encoding='utf-8')
          PY
      - name: Validate exact fixes
        run: |
          grep -n 'var parent: int = floori(float(index - 1) / 2.0)' scripts/actors/ravager.gd
          grep -n 'var velocity_scale := maximum_speed / horizontal_speed' scripts/actors/crucible_warden.gd
          if grep -n 'var parent := (index - 1) / 2' scripts/actors/ravager.gd; then exit 1; fi
          if grep -n 'var scale := maximum_speed / horizontal_speed' scripts/actors/crucible_warden.gd; then exit 1; fi
      - name: Install Godot 4.7.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Validate with Godot 4.7.1
        run: |
          ./Godot_v4.7.1-stable_linux.x86_64 --version
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Commit fixes
        run: |
          git config user.name OpenAI
          git config user.email openai@users.noreply.github.com
          git add scripts/actors/ravager.gd scripts/actors/crucible_warden.gd
          git diff --cached --quiet && exit 0
          git commit -m 'fix: clean AI GDScript warnings'
          git push origin HEAD:main
