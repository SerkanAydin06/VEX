name: Apply enemy common runtime stats patch

on:
  push:
    branches:
      - refactor/enemy-common-runtime-stats
    paths:
      - .github/workflows/temp_enemy_runtime_stats_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/enemy-common-runtime-stats
          fetch-depth: 0

      - name: Apply exact runtime stats patch
        run: python .github/temp_apply_enemy_runtime_stats_patch.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/actors/enemy_base.gd scripts/actors/enemy_combatant_base.gd scripts/actors/enemy_lunge_base.gd tests/enemy_common_runtime_stats_architecture_audit.py
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "Centralize common enemy runtime stats"
          git push origin HEAD:refactor/enemy-common-runtime-stats

# Trigger marker: workflow already exists on this branch.
