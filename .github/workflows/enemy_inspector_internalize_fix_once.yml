name: Enemy Inspector Internalize Fix Once

on:
  push:
    branches:
      - chatgpt/enemy-inspector-internalize-20260903

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply cleanup and audit contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          base_path = root / 'scripts/actors/enemy_base.gd'
          combatant_path = root / 'scripts/actors/enemy_combatant_base.gd'
          lunge_path = root / 'scripts/actors/enemy_lunge_base.gd'
          architecture_path = root / 'tests/enemy_script_architecture_audit.py'
          inspector_path = root / 'tests/enemy_inspector_documentation_audit.py'
          role_path = root / 'tests/enemy_role_ai_audit.py'

          common_internal = [
              'floor_collision_mask', 'floor_snap_max_correction',
              'floor_snap_ray_start_height', 'floor_snap_ray_extra_depth',
              'acoustic_collision_mask', 'acoustic_probe_height',
              'visibility_vertical_span_scale', 'visibility_vertical_span_min',
              'visibility_vertical_span_max', 'visibility_lateral_span_scale',
              'visibility_lateral_span_min', 'visibility_lateral_span_max',
              'visibility_shoulder_height_ratio', 'visibility_lower_body_ratio',
              'crouched_target_height_scale', 'crouched_target_min_height',
              'search_probe_diagonal_weight',
          ]
          family_internal = [
              'wall_normal_y_threshold', 'local_detour_progress_weight',
              'local_detour_distance_penalty', 'local_detour_direct_path_bonus',
              'local_detour_persistence_bonus', 'cover_diagonal_distance_scale',
              'cover_forward_distance_scale', 'cover_visibility_score_weight',
              'cover_distance_score_penalty', 'cover_threshold_score_bonus',
              'cover_failed_retry_interval',
          ]

          def pop_export(source: str, name: str):
              pattern = re.compile(rf'(?m)^## ([^\n]+)\n(@export[^\n]*\bvar {re.escape(name)}\b[^\n]*)\n')
              matches = list(pattern.finditer(source))
              assert len(matches) == 1, (name, len(matches))
              match = matches[0]
              export_line = match.group(2)
              declaration = export_line[export_line.find('var '):]
              assert declaration.startswith('var ')
              return source[:match.start()] + source[match.end():], match.group(1), declaration

          def internalize_local(source: str, name: str):
              pattern = re.compile(rf'(?m)^## ([^\n]+)\n(@export[^\n]*\bvar {re.escape(name)}\b[^\n]*)\n')
              matches = list(pattern.finditer(source))
              if not matches:
                  return source, False
              assert len(matches) == 1
              match = matches[0]
              export_line = match.group(2)
              declaration = export_line[export_line.find('var '):]
              replacement = '# ' + match.group(1) + '\n' + declaration + '\n'
              return source[:match.start()] + replacement + source[match.end():], True

          combatant = combatant_path.read_text(encoding='utf-8')
          lunge = lunge_path.read_text(encoding='utf-8')
          base = base_path.read_text(encoding='utf-8')
          parent_lines = [
              '# Sahne bazında override edilmeyen ortak teknik AI geometrisi/maskeleri.',
              '# Bunlar gameplay tuning Inspector alanı değildir; iki davranış ailesi tek kaynağı kullanır.',
          ]
          for name in common_internal:
              combatant, comment_a, declaration_a = pop_export(combatant, name)
              lunge, _, declaration_b = pop_export(lunge, name)
              assert declaration_a == declaration_b, (name, declaration_a, declaration_b)
              parent_lines += ['# ' + comment_a, declaration_a]
          marker = '# Combatant ve Lunge ailelerinin birebir ortak runtime state\'i burada tek kez tanımlanır.\n'
          assert base.count(marker) == 1
          base = base.replace(marker, '\n'.join(parent_lines) + '\n\n' + marker, 1)

          for name in family_internal:
              combatant, changed_a = internalize_local(combatant, name)
              lunge, changed_b = internalize_local(lunge, name)
              assert changed_a or changed_b, name
          category = '@export_category("03C - Görüş ve Arama Örnekleme")\n'
          assert lunge.count(category) == 1
          lunge = lunge.replace(category, '', 1)
          base_path.write_text(base, encoding='utf-8')
          combatant_path.write_text(combatant, encoding='utf-8')
          lunge_path.write_text(lunge, encoding='utf-8')

          architecture = architecture_path.read_text(encoding='utf-8')
          arch_anchor = '''for state_name in shared_runtime_state:
              pattern = rf"^var {re.escape(state_name)}(?:\\b|:)"
              assert re.search(pattern, enemy_base, re.M), state_name
              assert not re.search(pattern, combatant_base, re.M), ("combatant duplicate", state_name)
              assert not re.search(pattern, lunge_base, re.M), ("lunge duplicate", state_name)
          '''
          arch_add = '''
          shared_internal_tuning = [
              "floor_collision_mask", "floor_snap_max_correction",
              "floor_snap_ray_start_height", "floor_snap_ray_extra_depth",
              "acoustic_collision_mask", "acoustic_probe_height",
              "visibility_vertical_span_scale", "visibility_vertical_span_min",
              "visibility_vertical_span_max", "visibility_lateral_span_scale",
              "visibility_lateral_span_min", "visibility_lateral_span_max",
              "visibility_shoulder_height_ratio", "visibility_lower_body_ratio",
              "crouched_target_height_scale", "crouched_target_min_height",
              "search_probe_diagonal_weight",
          ]
          for tuning_name in shared_internal_tuning:
              pattern = rf"^var {re.escape(tuning_name)}(?:\\b|:)"
              assert re.search(pattern, enemy_base, re.M), tuning_name
              assert not re.search(pattern, combatant_base, re.M), ("combatant duplicate", tuning_name)
              assert not re.search(pattern, lunge_base, re.M), ("lunge duplicate", tuning_name)
              assert not re.search(rf"@export[^\\n]*\\bvar {re.escape(tuning_name)}\\b", enemy_base), tuning_name

          family_internal_tuning = [
              "wall_normal_y_threshold", "local_detour_progress_weight",
              "local_detour_distance_penalty", "local_detour_direct_path_bonus",
              "local_detour_persistence_bonus", "cover_diagonal_distance_scale",
              "cover_forward_distance_scale", "cover_visibility_score_weight",
              "cover_distance_score_penalty", "cover_threshold_score_bonus",
              "cover_failed_retry_interval",
          ]
          for tuning_name in family_internal_tuning:
              assert not re.search(rf"@export[^\\n]*\\bvar {re.escape(tuning_name)}\\b", combatant_base + "\\n" + lunge_base), tuning_name

          serialized_text = "\\n".join(
              path.read_text(encoding="utf-8", errors="ignore")
              for serialized_root in [ROOT / "scenes", ROOT / "resources"]
              if serialized_root.exists()
              for path in serialized_root.rglob("*")
              if path.suffix in {".tscn", ".tres"}
          )
          for tuning_name in shared_internal_tuning + family_internal_tuning:
              assert not re.search(rf"(?m)^\\s*{re.escape(tuning_name)}\\s*=", serialized_text), tuning_name
          '''
          assert architecture.count(arch_anchor) == 1
          architecture = architecture.replace(arch_anchor, arch_anchor + arch_add, 1)
          architecture_path.write_text(architecture, encoding='utf-8')

          inspector = inspector_path.read_text(encoding='utf-8')
          schema_line = '        "03C - Görüş ve Arama Örnekleme",\n'
          assert inspector.count(schema_line) == 1
          inspector = inspector.replace(schema_line, '', 1)
          inspector_path.write_text(inspector, encoding='utf-8')

          role = role_path.read_text(encoding='utf-8')
          old_common = '''common_inspector_settings = [
              "path_target_change_distance", "runtime_grid_step", "runtime_grid_max_nodes",
              "runtime_grid_search_margin", "sight_collision_mask", "aggro_on_damage",
              "damage_pursuit_min_progress", "damage_pursuit_stall_timeout",
              "damage_pursuit_commit_time", "acoustic_collision_mask", "acoustic_probe_height",
              "loud_noise_alert_threshold", "headshot_reference_height",
              "visibility_vertical_span_scale", "visibility_lateral_span_scale",
              "crouched_target_height_scale", "search_probe_diagonal_weight",
          ]
          '''
          new_common = '''common_inspector_settings = [
              "path_target_change_distance", "runtime_grid_step", "runtime_grid_max_nodes",
              "runtime_grid_search_margin", "sight_collision_mask", "aggro_on_damage",
              "damage_pursuit_min_progress", "damage_pursuit_stall_timeout",
              "damage_pursuit_commit_time", "loud_noise_alert_threshold",
              "headshot_reference_height",
          ]
          internal_role_settings = [
              "acoustic_collision_mask", "acoustic_probe_height",
              "visibility_vertical_span_scale", "visibility_lateral_span_scale",
              "crouched_target_height_scale", "search_probe_diagonal_weight",
          ]
          for setting in internal_role_settings:
              assert re.search(rf"^var {setting}\\b", enemy_base, re.M), setting
              assert not re.search(rf"@export[^\\n]*\\bvar {setting}\\b", enemy_base), setting
          '''
          assert role.count(old_common) == 1
          role = role.replace(old_common, new_common, 1)
          specific_line = '    "cover_visibility_score_weight",\n'
          assert role.count(specific_line) == 1
          role = role.replace(specific_line, '', 1)
          role_path.write_text(role, encoding='utf-8')

          for workflow_name in [
              'enemy_inspector_internalize_once.yml',
              'enemy_inspector_internalize_fix_once.yml',
          ]:
              workflow = root / '.github/workflows' / workflow_name
              assert workflow.exists()
              workflow.unlink()
          PY
      - name: Run every Python audit
        shell: bash
        run: |
          status=0
          while IFS= read -r audit; do
            echo "::group::$audit"
            python "$audit" || status=1
            echo "::endgroup::"
          done < <(find tests -maxdepth 1 -name '*_audit.py' -print | sort)
          exit "$status"
      - name: Verify patch scope
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/enemy_inspector_internalize_fix_once.yml' \
            '.github/workflows/enemy_inspector_internalize_once.yml' \
            'scripts/actors/enemy_base.gd' \
            'scripts/actors/enemy_combatant_base.gd' \
            'scripts/actors/enemy_lunge_base.gd' \
            'tests/enemy_inspector_documentation_audit.py' \
            'tests/enemy_role_ai_audit.py' \
            'tests/enemy_script_architecture_audit.py' | sort)"
          test "$changed" = "$expected"
      - name: Commit focused refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Internalize non-overridden enemy AI tuning"
          git push origin HEAD:${{ github.ref_name }}
