name: Patch Enemy Combat Runtime

on:
  push:
    branches: [refactor/enemy-combat-runtime]
    paths:
      - '.github/workflows/patch-enemy-combat-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refactor/enemy-combat-runtime
      - name: Patch combat runtime integration
        run: python3 tools/patch_enemy_combat_runtime.py
      - name: Commit integration
        shell: bash
        run: |
          git checkout -- .github/workflows/validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/actors/enemy_base.gd scripts/actors/enemy_combatant_base.gd tests/enemy_attack_recovery_animation_audit.py tests/enemy_attack_handoff_audit.py
          git commit -m "Integrate enemy combat runtime"
          git push origin HEAD:refactor/enemy-combat-runtime
