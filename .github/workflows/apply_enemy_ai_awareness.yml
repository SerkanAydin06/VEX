name: Apply Enemy Awareness Upgrade

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply_enemy_ai_awareness.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --ff-only origin main
      - name: Patch enemy awareness and investigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_between(text: str, start: str, end: str, replacement: str, label: str) -> str:
              i = text.find(start)
              if i < 0:
                  raise AssertionError(f"missing {label} start")
              j = text.find(end, i)
              if j < 0:
                  raise AssertionError(f"missing {label} end")
              return text[:i] + replacement + text[j:]

          # Shared perception geometry.
          utils_path = Path('scripts/actors/enemy_runtime_utils.gd')
          utils = utils_path.read_text(encoding='utf-8')
          assert 'static func has_visual_contact(' not in utils
          utils += '''\n\nstatic func has_visual_contact(\n\tworld: World3D,\n\tobserver_position: Vector3,\n\ttarget: Node3D,\n\tcollision_mask: int,\n\tobserver_rid: RID,\n\tfallback_target_height: float = 0.45\n) -> bool:\n\tif world == null or target == null or not is_instance_valid(target):\n\t\treturn false\n\n\tvar target_center := target.global_position + Vector3.UP * fallback_target_height\n\tvar half_height := maxf(fallback_target_height, 0.45)\n\tvar lateral_radius := 0.28\n\tvar shape_node := target.get_node_or_null("CollisionShape3D") as CollisionShape3D\n\tif shape_node != null and shape_node.shape != null and not shape_node.disabled:\n\t\ttarget_center = shape_node.global_position\n\t\tvar capsule := shape_node.shape as CapsuleShape3D\n\t\tif capsule != null:\n\t\t\thalf_height = maxf(capsule.height * 0.5, capsule.radius)\n\t\t\tlateral_radius = capsule.radius\n\t\telse:\n\t\t\tvar box := shape_node.shape as BoxShape3D\n\t\t\tif box != null:\n\t\t\t\thalf_height = box.size.y * 0.5\n\t\t\t\tlateral_radius = minf(box.size.x, box.size.z) * 0.5\n\n\tvar toward_target := target.global_position - observer_position\n\ttoward_target.y = 0.0\n\tif toward_target.length_squared() <= 0.0001:\n\t\ttoward_target = Vector3.FORWARD\n\telse:\n\t\ttoward_target = toward_target.normalized()\n\tvar side := Vector3.UP.cross(toward_target).normalized()\n\tvar vertical_span := clampf(half_height * 0.55, 0.20, 0.68)\n\tvar lateral_span := clampf(lateral_radius * 0.82, 0.15, 0.38)\n\n\t# Merkez ilk sırada: açık görüşte eski tek-ray maliyeti korunur. Ek örnekler\n\t# yalnız merkez kapı/duvar tarafından kesildiğinde omuz/üst gövde görünürlüğünü\n\t# yakalamak için çalışır.\n\tvar samples: Array[Vector3] = [\n\t\ttarget_center,\n\t\ttarget_center + Vector3.UP * vertical_span,\n\t\ttarget_center + side * lateral_span + Vector3.UP * (vertical_span * 0.08),\n\t\ttarget_center - side * lateral_span + Vector3.UP * (vertical_span * 0.08),\n\t\ttarget_center - Vector3.UP * (vertical_span * 0.45),\n\t]\n\tvar space_state := world.direct_space_state\n\tfor sample: Vector3 in samples:\n\t\tvar query := PhysicsRayQueryParameters3D.create(\n\t\t\tobserver_position,\n\t\t\tsample,\n\t\t\tcollision_mask,\n\t\t\t[observer_rid]\n\t\t)\n\t\tquery.collide_with_areas = true\n\t\tvar result := space_state.intersect_ray(query)\n\t\tif result.is_empty():\n\t\t\tcontinue\n\t\tvar collider := result.get("collider") as Node\n\t\tif _node_belongs_to_target(collider, target):\n\t\t\treturn true\n\treturn false\n\n\nstatic func investigation_probe(\n\tcenter: Vector3,\n\tforward_hint: Vector3,\n\tprobe_index: int,\n\tradius: float\n) -> Vector3:\n\tvar forward := forward_hint\n\tforward.y = 0.0\n\tif forward.length_squared() <= 0.0001:\n\t\tforward = Vector3.FORWARD\n\telse:\n\t\tforward = forward.normalized()\n\tvar right := Vector3(-forward.z, 0.0, forward.x).normalized()\n\tvar directions: Array[Vector3] = [\n\t\tforward,\n\t\t(forward + right * 0.85).normalized(),\n\t\t(forward - right * 0.85).normalized(),\n\t\tright,\n\t\t-right,\n\t\t-forward,\n\t]\n\tvar direction := directions[probe_index % directions.size()]\n\tvar result := center + direction * maxf(radius, 0.1)\n\tresult.y = center.y\n\treturn result\n\n\nstatic func _node_belongs_to_target(collider: Node, target: Node) -> bool:\n\tvar current := collider\n\tvar depth := 0\n\twhile current != null and depth < 6:\n\t\tif current == target:\n\t\t\treturn true\n\t\tcurrent = current.get_parent()\n\t\tdepth += 1\n\treturn false\n'''
          utils_path.write_text(utils, encoding='utf-8')

          # Ravager family: partial visibility, ally awareness, active investigation.
          rav_path = Path('scripts/actors/ravager.gd')
          rav = rav_path.read_text(encoding='utf-8')
          assert 'search_probe_radius' not in rav
          rav = rav.replace(
              '@export_range(1.0, 30.0, 0.5) var search_duration := 10.0\n',
              '@export_range(1.0, 30.0, 0.5) var search_duration := 10.0\n@export_range(0.5, 5.0, 0.1) var search_probe_radius := 2.2\n',
              1,
          )
          rav = rav.replace(
              '@export var alert_allies_on_damage := true\n',
              '@export var alert_allies_on_damage := true\n@export var alert_allies_on_detection := true\n',
              1,
          )
          rav = rav.replace(
              'var _search_remaining := 0.0\n',
              'var _search_remaining := 0.0\nvar _search_probe_index := 0\nvar _search_probe_target := Vector3.ZERO\nvar _has_search_probe := false\n',
              1,
          )

          old = '''\tif _player_visible:\n\t\t_alerted = true\n\t\t_seconds_without_sight = 0.0\n\telif _alerted:\n\t\t_seconds_without_sight += delta\n'''
          new = '''\tif _player_visible:\n\t\tvar was_alerted := _alerted\n\t\t_alerted = true\n\t\t_seconds_without_sight = 0.0\n\t\tif not was_alerted and alert_allies_on_detection and _has_last_seen_position:\n\t\t\t_alert_nearby_allies(_last_seen_position)\n\telif _alerted:\n\t\t_seconds_without_sight += delta\n'''
          assert old in rav
          rav = rav.replace(old, new, 1)

          old = '''\t\tif _has_last_seen_position:\n\t\t\tstate = State.CHASE\n\t\t\tif _horizontal_distance(global_position, _last_seen_position) <= waypoint_reach_distance:\n\t\t\t\t_stop_horizontal_motion()\n\t\t\telse:\n\t\t\t\t_navigate_to(_last_seen_position, delta)\n\t\t\treturn\n'''
          new = '''\t\tif _has_last_seen_position:\n\t\t\tstate = State.CHASE\n\t\t\tif _horizontal_distance(global_position, _last_seen_position) <= waypoint_reach_distance:\n\t\t\t\t_begin_search()\n\t\t\telse:\n\t\t\t\t_navigate_to(_last_seen_position, delta)\n\t\t\treturn\n'''
          assert old in rav
          rav = rav.replace(old, new, 1)

          rav_search = '''func _begin_search() -> void:\n\tstate = State.SEARCH\n\t_search_remaining = search_duration\n\t_reset_search_probe()\n\t_advance_search_probe()\n\n\nfunc _reset_search_probe() -> void:\n\t_search_probe_index = 0\n\t_search_probe_target = Vector3.ZERO\n\t_has_search_probe = false\n\n\nfunc _advance_search_probe() -> void:\n\tif not _has_last_seen_position:\n\t\t_reset_search_probe()\n\t\treturn\n\t_search_probe_target = VexEnemyRuntimeUtils.investigation_probe(\n\t\t_last_seen_position,\n\t\t_facing_direction,\n\t\t_search_probe_index,\n\t\tsearch_probe_radius\n\t)\n\t_search_probe_target.y = global_position.y\n\t_search_probe_index += 1\n\t_has_search_probe = true\n\t_clear_path()\n\t_path_refresh_remaining = 0.0\n\n\nfunc _search_last_seen_area(delta: float) -> void:\n\t_search_remaining -= delta\n\tif _search_remaining <= 0.0 or not _has_last_seen_position:\n\t\t_give_up_chase()\n\t\treturn\n\n\tif (\n\t\tnot _has_search_probe\n\t\tor _horizontal_distance(global_position, _search_probe_target) <= waypoint_reach_distance\n\t):\n\t\t_advance_search_probe()\n\n\t# Ulaşılamayan tek bir probe bütün aramayı kilitlemesin. AStar rota bulamazsa\n\t# aynı karede birkaç alternatif köşe/yan probe dene.\n\tfor _attempt: int in range(4):\n\t\t_navigate_to(_search_probe_target, delta)\n\t\tif not _current_path.is_empty() and _path_index < _current_path.size():\n\t\t\treturn\n\t\t_advance_search_probe()\n\n\t_stop_horizontal_motion()\n\t_facing_direction = _facing_direction.rotated(\n\t\tVector3.UP,\n\t\tdeg_to_rad(search_turn_speed) * delta\n\t).normalized()\n\trotation.y = atan2(-_facing_direction.x, -_facing_direction.z)\n\n\n'''
          rav = replace_between(
              rav,
              'func _begin_search() -> void:\n',
              'func _give_up_chase() -> void:\n',
              rav_search,
              'ravager search functions',
          )
          rav = rav.replace(
              '\t_has_last_seen_position = false\n\tstate = State.RETURN\n',
              '\t_has_last_seen_position = false\n\t_reset_search_probe()\n\tstate = State.RETURN\n',
              1,
          )

          rav_los = '''func _check_line_of_sight() -> bool:\n\tif _player == null or not is_instance_valid(_player):\n\t\treturn false\n\tvar origin := global_position + Vector3.UP * sight_origin_height\n\treturn VexEnemyRuntimeUtils.has_visual_contact(\n\t\tget_world_3d(),\n\t\torigin,\n\t\t_player,\n\t\tsight_collision_mask,\n\t\tget_rid(),\n\t\tsight_target_height\n\t)\n\n\n'''
          rav = replace_between(
              rav,
              'func _check_line_of_sight() -> bool:\n',
              'func _get_crouched_sight_target_height() -> float:\n',
              rav_los,
              'ravager line of sight',
          )
          rav_path.write_text(rav, encoding='utf-8')

          # RedViper family: same partial visibility + moving search probes.
          vip_path = Path('scripts/actors/redviper.gd')
          vip = vip_path.read_text(encoding='utf-8')
          assert 'search_probe_radius' not in vip
          vip = vip.replace(
              '@export_range(1.0, 20.0, 0.5) var search_duration := 10.0\n',
              '@export_range(1.0, 20.0, 0.5) var search_duration := 10.0\n@export_range(0.5, 5.0, 0.1) var search_probe_radius := 2.0\n',
              1,
          )
          vip = vip.replace(
              'var _search_remaining := 0.0\n',
              'var _search_remaining := 0.0\nvar _search_probe_index := 0\nvar _search_probe_target := Vector3.ZERO\nvar _has_search_probe := false\n',
              1,
          )
          # Every fresh clue (visual/noise/damage/ally alert) restarts the sweep.
          vip, count = re.subn(
              r'(?m)^(\s*)_search_remaining = search_duration$',
              r'\1_search_remaining = search_duration\n\1_reset_search_probe()',
              vip,
          )
          assert count >= 4, count

          vip_search_block = '''\t\t# Görüş kesilince son görülen noktaya kadar kovala. Noktaya ulaşıldığında\n\t\t# kalan hafıza süresini boşta beklemek yerine aktif köşe/yan aramasına geçir.\n\t\tif _aggro and _lost_sight_remaining > 0.0:\n\t\t\t_lost_sight_remaining = maxf(0.0, _lost_sight_remaining - delta)\n\t\t\tif _horizontal_distance(global_position, _last_seen_position) > investigation_reach_distance:\n\t\t\t\t_chase_position(delta, _last_seen_position)\n\t\t\t\tmove_and_slide()\n\t\t\t\t_update_chase_detour()\n\t\t\t\treturn\n\t\t\t_lost_sight_remaining = 0.0\n\n\t\tif _aggro and _search_remaining > 0.0:\n\t\t\t_search_remaining = maxf(0.0, _search_remaining - delta)\n\t\t\t_investigate_last_seen(delta)\n\t\t\tmove_and_slide()\n\t\t\t_update_chase_detour()\n\t\t\treturn\n\n'''
          vip = replace_between(
              vip,
              '\t\t# Görüş kesilince anında devriyeye dönmez;',
              '\n\t\tif _aggro:\n',
              vip_search_block,
              'redviper lost sight/search block',
          )
          vip = vip.replace(
              '\t\t\t_search_remaining = 0.0\n\n\tif _wait_remaining > 0.0:',
              '\t\t\t_search_remaining = 0.0\n\t\t\t_reset_search_probe()\n\n\tif _wait_remaining > 0.0:',
              1,
          )

          vip_probe_helpers = '''func _reset_search_probe() -> void:\n\t_search_probe_index = 0\n\t_search_probe_target = Vector3.ZERO\n\t_has_search_probe = false\n\n\nfunc _advance_search_probe() -> void:\n\t_search_probe_target = VexEnemyRuntimeUtils.investigation_probe(\n\t\t_last_seen_position,\n\t\t_facing_direction,\n\t\t_search_probe_index,\n\t\tsearch_probe_radius\n\t)\n\t_search_probe_target.y = global_position.y\n\t_search_probe_index += 1\n\t_has_search_probe = true\n\t_detour_remaining = 0.0\n\n\nfunc _investigate_last_seen(delta: float) -> void:\n\tif (\n\t\tnot _has_search_probe\n\t\tor _horizontal_distance(global_position, _search_probe_target) <= investigation_reach_distance\n\t):\n\t\t_advance_search_probe()\n\t_chase_position(delta, _search_probe_target)\n\n\n'''
          anchor = 'func _is_player_inside_initial_view() -> bool:\n'
          assert anchor in vip
          vip = vip.replace(anchor, vip_probe_helpers + anchor, 1)

          vip_los = '''func _check_line_of_sight() -> bool:\n\tif _player == null or not is_instance_valid(_player):\n\t\treturn false\n\tvar origin := global_position + Vector3.UP * sight_origin_height\n\tif not VexEnemyRuntimeUtils.has_visual_contact(\n\t\tget_world_3d(),\n\t\torigin,\n\t\t_player,\n\t\t1 | 2,\n\t\tget_rid(),\n\t\tsight_target_height\n\t):\n\t\treturn false\n\n\tvar player_distance := _horizontal_distance(global_position, _player.global_position)\n\tif (\n\t\tnot _aggro\n\t\tand _player.get("is_crouching") == true\n\t\tand player_distance > crouch_guaranteed_detection_distance\n\t):\n\t\treturn randf() <= crouch_detection_chance\n\treturn true\n\n\n'''
          vip = replace_between(
              vip,
              'func _check_line_of_sight() -> bool:\n',
              'func _get_crouched_sight_target_height() -> float:\n',
              vip_los,
              'redviper line of sight',
          )
          vip_path.write_text(vip, encoding='utf-8')

          # Expand the existing detection regression audit.
          audit_path = Path('tests/enemy_detection_audit.py')
          audit = audit_path.read_text(encoding='utf-8')
          assert 'has_visual_contact' not in audit
          audit += '''\n\nutils_script = (ROOT / "scripts/actors/enemy_runtime_utils.gd").read_text(encoding="utf-8")\nfor needle in [\n    "static func has_visual_contact(",\n    "target_center + side * lateral_span",\n    "target_center - side * lateral_span",\n    "static func investigation_probe(",\n]:\n    assert needle in utils_script, needle\n\nfor needle in [\n    "search_probe_radius := 2.2",\n    "alert_allies_on_detection := true",\n    "VexEnemyRuntimeUtils.has_visual_contact(",\n    "func _advance_search_probe()",\n    "VexEnemyRuntimeUtils.investigation_probe(",\n    "_begin_search()",\n]:\n    assert needle in ravager_script, needle\n\nfor needle in [\n    "search_probe_radius := 2.0",\n    "VexEnemyRuntimeUtils.has_visual_contact(",\n    "func _investigate_last_seen(delta: float)",\n    "VexEnemyRuntimeUtils.investigation_probe(",\n    "_lost_sight_remaining = 0.0",\n]:\n    assert needle in redviper_script, needle\n\nprint("Enemy awareness/search contract passed")\n'''
          audit_path.write_text(audit, encoding='utf-8')
          PY
      - name: Diff sanity
        run: git diff --check
      - name: Validate enemy detection and awareness
        run: python tests/enemy_detection_audit.py
      - name: Install official Godot 4.7
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" "$GODOT_URL"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Verify Godot version
        run: godot --version | grep '^4.7'
      - name: Import project headlessly
        run: godot --headless --editor --path . --quit
      - name: Commit upgrade
        run: |
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add scripts/actors/enemy_runtime_utils.gd scripts/actors/ravager.gd scripts/actors/redviper.gd tests/enemy_detection_audit.py
          if git diff --cached --quiet; then
            echo "No AI changes to commit"
            exit 0
          fi
          git commit -m "feat: improve enemy awareness and investigation"
          git push origin HEAD:main
