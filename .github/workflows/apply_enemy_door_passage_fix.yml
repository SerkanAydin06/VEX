name: Apply Enemy Door Passage Fix

on:
  push:
    branches: [main]
    paths:
      - tools/apply_enemy_door_passage_fix.py
      - .github/workflows/apply_enemy_door_passage_fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Apply door passage fix
        run: python tools/apply_enemy_door_passage_fix.py

      - name: Validate enemy AI contracts
        run: |
          python tests/enemy_door_passage_audit.py
          python tests/enemy_role_ai_audit.py
          python tests/enemy_detection_audit.py
          python tests/enemy_runtime_global_path_audit.py

      - name: Install Godot 4.7.1
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" "$GODOT_URL"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.7.1-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Validate Godot 4.7.1 import
        run: |
          godot --version | grep '^4.7.1'
          godot --headless --editor --path . --quit

      - name: Commit gameplay changes
        run: |
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add scripts/actors/ravager.gd scripts/actors/redviper.gd scripts/props/door.gd tests/enemy_door_passage_audit.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix align enemy door passage"
          git pull --rebase origin main
          git push origin HEAD:main
