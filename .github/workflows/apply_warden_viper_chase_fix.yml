name: Apply Warden Viper Chase Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply_warden_viper_chase_fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Apply Warden chase fix
        run: python .github/fix_warden_viper_chase.py
      - name: Validate chase contract
        run: |
          python -c "from pathlib import Path; s=Path('scripts/actors/crucible_warden.gd').read_text(); assert 'func _refresh_warden_collision_detour() -> void:' in s; assert '_warden_detour_remaining = 0.70' in s; assert 'super._navigate_to(target, delta)' in s; assert '_navigate_to(_player.global_position, delta)' in s; assert 'velocity.x *= speed_scale' in s"
          python -c "from pathlib import Path; s=Path('scripts/actors/redviper.gd').read_text(); assert 'func _update_chase_detour() -> void:' in s; assert 'tangent_a.dot(target_direction)' in s"
      - name: Install Godot 4.7
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q Godot_v4.7-stable_linux.x86_64.zip
          chmod +x Godot_v4.7-stable_linux.x86_64
      - name: Validate Godot scripts
        run: |
          ./Godot_v4.7-stable_linux.x86_64 --version
          ./Godot_v4.7-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Commit gameplay fix
        run: |
          git config user.name OpenAI
          git config user.email openai@users.noreply.github.com
          git add scripts/actors/crucible_warden.gd
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make warden chase cover like vipers'
          git push origin HEAD:main
