name: Finalize Vaskari Legacy Cleanup

on:
  push:
    branches:
      - cleanup/vaskari-legacy-final
    paths:
      - .github/workflows/finalize-vaskari-legacy-cleanup.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove remaining legacy Viper labels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          replacements = {
              "UpperAuthorizationViper": "UpperAuthorizationRavager",
              "vex03_mezzanine_viper": "vex03_mezzanine_vaskari_ravager",
          }
          for raw in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0"):
              if not raw:
                  continue
              p = Path(raw.decode())
              if not p.is_file():
                  continue
              data = p.read_bytes()
              if b"\0" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              new = text
              for old, repl in replacements.items():
                  new = new.replace(old, repl)
              if new != text:
                  p.write_text(new, encoding="utf-8")
          PY

          rm -f .github/workflows/finalize-vaskari-legacy-cleanup.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove final legacy Viper labels"
          git push origin HEAD:cleanup/vaskari-legacy-final
