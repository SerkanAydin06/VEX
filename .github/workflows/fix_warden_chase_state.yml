name: Fix Warden Chase State

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix_warden_chase_state.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Fix state and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/actors/crucible_warden.gd')
          s = p.read_text(encoding='utf-8')
          if 'State.CHASH' not in s:
              raise SystemExit('expected CHASH typo not found')
          s = s.replace('State.CHASH', 'State.CHASE')
          p.write_text(s, encoding='utf-8')
          s = p.read_text(encoding='utf-8')
          assert 'State.CHASH' not in s
          assert 'state = State.CHASE' in s
          assert 'func _warden_cover_advance_target' in s
          print('Warden chase state fixed')
          PY
      - name: Commit fix
        run: |
          git config user.name OpenAI
          git config user.email openai@users.noreply.github.com
          git add scripts/actors/crucible_warden.gd
          git commit -m 'fix: correct warden cover chase state'
          git push origin HEAD:main
