name: Apply Enemy Pursuit Door Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply_enemy_pursuit_door_fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Patch pursuit and door routing
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"pattern missing in {path}: {old[:120]!r}")
              text = text.replace(old, new, 1)
              p.write_text(text, encoding="utf-8")

          # --- Door: enemy navigation portal + pursuing enemy auto-open ---
          replace_once(
              "scripts/props/door.gd",
              '@export var automatic_open := false\n\n@export_category("Güvenli Kapanma")',
              '@export var automatic_open := false\n\n@export_category("Düşman Geçişi")\n@export var allow_enemy_open := true\n@export_range(0.5, 2.5, 0.05) var enemy_portal_offset := 1.15\n@export_range(2.0, 24.0, 0.5) var enemy_portal_consider_distance := 14.0\n\n@export_category("Güvenli Kapanma")'
          )
          replace_once(
              "scripts/props/door.gd",
              'func _ready() -> void:\n\tadd_to_group("interactable")',
              'func _ready() -> void:\n\tadd_to_group("interactable")\n\tadd_to_group("enemy_navigation_door")'
          )
          replace_once(
              "scripts/props/door.gd",
              '\tif proximity_sensor != null and not proximity_sensor.body_entered.is_connected(_on_proximity_body_entered):\n\t\tproximity_sensor.body_entered.connect(_on_proximity_body_entered)',
              '\tif proximity_sensor != null:\n\t\tproximity_sensor.collision_layer = 0\n\t\tproximity_sensor.collision_mask = 2 | (4 if allow_enemy_open else 0)\n\t\tif not proximity_sensor.body_entered.is_connected(_on_proximity_body_entered):\n\t\t\tproximity_sensor.body_entered.connect(_on_proximity_body_entered)'
          )
          old_proximity = '''func _on_proximity_body_entered(body: Node3D) -> void:\n\tif not automatic_open or body == null or body != GameState.player:\n\t\treturn\n\tif permanently_locked or _runtime_locked:\n\t\treturn\n\tif _state == DoorState.CLOSED or _state == DoorState.CLOSING:\n\t\t_begin_opening()\n'''
          new_proximity = '''func _on_proximity_body_entered(body: Node3D) -> void:\n\tif body == null:\n\t\treturn\n\tvar player_trigger := automatic_open and body == GameState.player\n\tvar enemy_trigger := (\n\t\tallow_enemy_open\n\t\tand body.is_in_group("enemy")\n\t\tand body.has_method("is_pursuing_player")\n\t\tand bool(body.call("is_pursuing_player"))\n\t)\n\tif not player_trigger and not enemy_trigger:\n\t\treturn\n\tif is_access_locked():\n\t\treturn\n\tif _state == DoorState.CLOSED or _state == DoorState.CLOSING:\n\t\t_begin_opening()\n\n\nfunc get_enemy_navigation_step(from_position: Vector3, target_position: Vector3) -> Dictionary:\n\tif not allow_enemy_open or is_access_locked():\n\t\treturn {}\n\n\tvar from_local := to_local(from_position)\n\tvar target_local := to_local(target_position)\n\tvar plane_epsilon := 0.30\n\t# Kapı yalnız hedef gerçekten öbür taraftaysa rota portalı olur. Aynı taraftaki\n\t# kapılara sırf yakın oldukları için sapmak istemiyoruz.\n\tif (\n\t\tabsf(from_local.x) > plane_epsilon\n\t\tand absf(target_local.x) > plane_epsilon\n\t\tand signf(from_local.x) == signf(target_local.x)\n\t):\n\t\treturn {}\n\n\tvar horizontal_to_door := Vector2(\n\t\tfrom_position.x - global_position.x,\n\t\tfrom_position.z - global_position.z\n\t).length()\n\tif horizontal_to_door > enemy_portal_consider_distance:\n\t\treturn {}\n\n\tvar from_side := 1.0 if from_local.x >= 0.0 else -1.0\n\tvar near_point := to_global(Vector3(from_side * enemy_portal_offset, 0.0, 0.0))\n\tvar far_point := to_global(Vector3(-from_side * enemy_portal_offset, 0.0, 0.0))\n\tnear_point.y = from_position.y\n\tfar_point.y = from_position.y\n\n\tvar approach_distance := Vector2(\n\t\tfrom_position.x - near_point.x,\n\t\tfrom_position.z - near_point.z\n\t).length()\n\tvar route_point := near_point\n\t# Panel tamamen açılmadan öbür tarafa hedef verme; aksi halde melee AI açılan\n\t# panelin gövdesine çarpıp tangent detour ile kapı ağzından kaçabiliyor.\n\tif _state == DoorState.OPEN and approach_distance <= enemy_portal_offset * 1.35:\n\t\troute_point = far_point\n\n\tvar score := from_position.distance_to(near_point) + far_point.distance_to(target_position)\n\treturn {"valid": true, "point": route_point, "score": score}\n'''
          replace_once("scripts/props/door.gd", old_proximity, new_proximity)

          # --- Ravager family: damage retaliation range and door portal routing ---
          replace_once(
              "scripts/actors/ravager.gd",
              '@export var receive_ally_alerts := true\n@export_category("03B - İşitme / Stealth")',
              '@export var receive_ally_alerts := true\n@export_range(1.0, 120.0, 1.0) var damage_reaction_range := 80.0\n@export_range(1.0, 30.0, 0.5) var damage_reaction_duration := 12.0\n@export_category("03B - İşitme / Stealth")'
          )
          replace_once(
              "scripts/actors/ravager.gd",
              'var _has_search_probe := false\n\nstatic var _shared_navigation_scene_id := -1',
              'var _has_search_probe := false\nvar _damage_reaction_remaining := 0.0\n\nstatic var _shared_navigation_scene_id := -1'
          )
          replace_once(
              "scripts/actors/ravager.gd",
              '\tif _player == null or not is_instance_valid(_player):\n\t\t_player = GameState.player as Node3D\n\n\tif _should_use_dormant_mode():',
              '\tif _player == null or not is_instance_valid(_player):\n\t\t_player = GameState.player as Node3D\n\t_damage_reaction_remaining = maxf(0.0, _damage_reaction_remaining - delta)\n\n\tif _should_use_dormant_mode():'
          )
          replace_once(
              "scripts/actors/ravager.gd",
              '\tif aggro_on_damage:\n\t\t_alerted = true\n\t\t_seconds_without_sight = 0.0\n\t\t_search_remaining = 0.0',
              '\tif aggro_on_damage:\n\t\t_alerted = true\n\t\t_damage_reaction_remaining = damage_reaction_duration\n\t\t_seconds_without_sight = 0.0\n\t\t_search_remaining = 0.0\n\t\t_sight_check_remaining = 0.0'
          )
          replace_once(
              "scripts/actors/ravager.gd",
              '\t\t_path_refresh_remaining = 0.0\n\t\tif alert_allies_on_damage:',
              '\t\t_path_refresh_remaining = 0.0\n\t\t_clear_path()\n\t\tif _has_last_seen_position:\n\t\t\t_face_toward_position(_last_seen_position)\n\t\tif alert_allies_on_damage:'
          )
          replace_once(
              "scripts/actors/ravager.gd",
              '\tvar active_range := (\n\t\t_runtime_pursuit_range\n\t\tif _alerted\n\t\telse _runtime_detection_range\n\t)\n',
              '\tvar active_range := (\n\t\t_runtime_pursuit_range\n\t\tif _alerted\n\t\telse _runtime_detection_range\n\t)\n\tif _damage_reaction_remaining > 0.0:\n\t\tactive_range = maxf(active_range, damage_reaction_range)\n'
          )
          replace_once(
              "scripts/actors/ravager.gd",
              'func _navigate_to(target: Vector3, delta: float) -> void:\n\tvar destination := target\n\tdestination.y = global_position.y',
              'func _navigate_to(target: Vector3, delta: float) -> void:\n\tvar destination := _resolve_enemy_door_step(target)\n\tdestination.y = global_position.y'
          )
          marker = '''func _patrol(delta: float) -> void:\n'''
          insert = '''func is_pursuing_player() -> bool:\n\treturn state != State.DEAD and _alerted\n\n\nfunc _resolve_enemy_door_step(target_position: Vector3) -> Vector3:\n\tvar best_point := target_position\n\tvar best_score := INF\n\tvar found := false\n\tfor node: Node in get_tree().get_nodes_in_group("enemy_navigation_door"):\n\t\tif not node.has_method("get_enemy_navigation_step"):\n\t\t\tcontinue\n\t\tvar route: Variant = node.call("get_enemy_navigation_step", global_position, target_position)\n\t\tif not (route is Dictionary):\n\t\t\tcontinue\n\t\tvar data := route as Dictionary\n\t\tif not bool(data.get("valid", false)):\n\t\t\tcontinue\n\t\tvar point: Variant = data.get("point", target_position)\n\t\tif typeof(point) != TYPE_VECTOR3:\n\t\t\tcontinue\n\t\tvar score := float(data.get("score", INF))\n\t\tif score < best_score:\n\t\t\tbest_score = score\n\t\t\tbest_point = point\n\t\t\tfound = true\n\treturn best_point if found else target_position\n\n\n'''
          replace_once("scripts/actors/ravager.gd", marker, insert + marker)

          # --- RedViper family: same retaliation memory + door portal steering ---
          replace_once(
              "scripts/actors/redviper.gd",
              '@export var alert_allies_on_damage := true\n@export_category("03B - İşitme / Stealth")',
              '@export var alert_allies_on_damage := true\n@export_range(1.0, 120.0, 1.0) var damage_reaction_range := 80.0\n@export_range(1.0, 30.0, 0.5) var damage_reaction_duration := 12.0\n@export_category("03B - İşitme / Stealth")'
          )
          replace_once(
              "scripts/actors/redviper.gd",
              'var _has_search_probe := false\nvar _last_seen_position := Vector3.ZERO',
              'var _has_search_probe := false\nvar _damage_reaction_remaining := 0.0\nvar _last_seen_position := Vector3.ZERO'
          )
          replace_once(
              "scripts/actors/redviper.gd",
              '\tif _player == null or not is_instance_valid(_player):\n\t\t_player = GameState.player as Node3D\n\n\tif _should_use_dormant_mode():',
              '\tif _player == null or not is_instance_valid(_player):\n\t\t_player = GameState.player as Node3D\n\t_damage_reaction_remaining = maxf(0.0, _damage_reaction_remaining - delta)\n\n\tif _should_use_dormant_mode():'
          )
          replace_once(
              "scripts/actors/redviper.gd",
              '\t\tvar active_sight_range: float = (\n\t\t\t_runtime_pursuit_range\n\t\t\tif _aggro\n\t\t\telse _runtime_detection_range\n\t\t)',
              '\t\tvar active_sight_range: float = (\n\t\t\t_runtime_pursuit_range\n\t\t\tif _aggro\n\t\t\telse _runtime_detection_range\n\t\t)\n\t\tif _damage_reaction_remaining > 0.0:\n\t\t\tactive_sight_range = maxf(active_sight_range, damage_reaction_range)'
          )
          replace_once(
              "scripts/actors/redviper.gd",
              'func _chase_position(delta: float, target_position: Vector3) -> void:\n\t_movement_target = target_position\n\tvar direction: Vector3 = target_position - global_position',
              'func _chase_position(delta: float, target_position: Vector3) -> void:\n\tvar resolved_target := _resolve_enemy_door_step(target_position)\n\t_movement_target = resolved_target\n\tvar direction: Vector3 = resolved_target - global_position'
          )
          old_red_damage = '''\tif aggro_on_damage:\n\t\tif _player == null or not is_instance_valid(_player):\n\t\t\t_player = GameState.player as Node3D\n\t\tif _player != null and is_instance_valid(_player):\n\t\t\t_aggro = true\n\t\t\t_last_seen_position = _player.global_position\n\t\t\t_lost_sight_remaining = lost_sight_timeout\n\t\t\t_search_remaining = search_duration\n\t\t\t_reset_search_probe()\n\t\t\tif alert_allies_on_damage:\n\t\t\t\t_alert_nearby_allies(_last_seen_position)\n'''
          new_red_damage = '''\tif aggro_on_damage:\n\t\tif _player == null or not is_instance_valid(_player):\n\t\t\t_player = GameState.player as Node3D\n\t\tvar retaliation_target := _source as Node3D if _source is Node3D else _player\n\t\tif retaliation_target != null and is_instance_valid(retaliation_target):\n\t\t\t_aggro = true\n\t\t\t_damage_reaction_remaining = damage_reaction_duration\n\t\t\t_last_seen_position = retaliation_target.global_position\n\t\t\t_lost_sight_remaining = lost_sight_timeout\n\t\t\t_search_remaining = search_duration\n\t\t\t_cached_player_visible = false\n\t\t\t_sight_check_remaining = 0.0\n\t\t\t_detour_remaining = 0.0\n\t\t\t_reset_search_probe()\n\t\t\t_face_position(_last_seen_position)\n\t\t\tif alert_allies_on_damage:\n\t\t\t\t_alert_nearby_allies(_last_seen_position)\n'''
          replace_once("scripts/actors/redviper.gd", old_red_damage, new_red_damage)
          marker2 = '''func _face_position(target_position: Vector3) -> void:\n'''
          insert2 = '''func is_pursuing_player() -> bool:\n\treturn not _dead and _aggro\n\n\nfunc _resolve_enemy_door_step(target_position: Vector3) -> Vector3:\n\tvar best_point := target_position\n\tvar best_score := INF\n\tvar found := false\n\tfor node: Node in get_tree().get_nodes_in_group("enemy_navigation_door"):\n\t\tif not node.has_method("get_enemy_navigation_step"):\n\t\t\tcontinue\n\t\tvar route: Variant = node.call("get_enemy_navigation_step", global_position, target_position)\n\t\tif not (route is Dictionary):\n\t\t\tcontinue\n\t\tvar data := route as Dictionary\n\t\tif not bool(data.get("valid", false)):\n\t\t\tcontinue\n\t\tvar point: Variant = data.get("point", target_position)\n\t\tif typeof(point) != TYPE_VECTOR3:\n\t\t\tcontinue\n\t\tvar score := float(data.get("score", INF))\n\t\tif score < best_score:\n\t\t\tbest_score = score\n\t\t\tbest_point = point\n\t\t\tfound = true\n\treturn best_point if found else target_position\n\n\n'''
          replace_once("scripts/actors/redviper.gd", marker2, insert2 + marker2)

          # --- Audit locks the new behavior ---
          audit = Path("tests/enemy_detection_audit.py")
          text = audit.read_text(encoding="utf-8")
          if 'door_script = (ROOT / "scripts/props/door.gd")' not in text:
              text = text.replace(
                  'print("Enemy detection audit passed")',
                  '''door_script = (ROOT / "scripts/props/door.gd").read_text(encoding="utf-8")\nfor script_name, script in (("ravager", ravager_script), ("redviper", redviper_script)):\n    assert "damage_reaction_range := 80.0" in script, script_name\n    assert "damage_reaction_duration := 12.0" in script, script_name\n    assert "func is_pursuing_player() -> bool:" in script, script_name\n    assert "_resolve_enemy_door_step" in script, script_name\nassert 'add_to_group("enemy_navigation_door")' in door_script\nassert "func get_enemy_navigation_step(" in door_script\nassert "allow_enemy_open := true" in door_script\nassert 'proximity_sensor.collision_mask = 2 | (4 if allow_enemy_open else 0)' in door_script\n\nprint("Enemy detection audit passed")'''
              )
              audit.write_text(text, encoding="utf-8")
      - name: Diff sanity
        run: git diff --check && git diff --stat
      - name: Validate enemy pursuit contract
        run: python tests/enemy_detection_audit.py
      - name: Install official Godot 4.7
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" "$GODOT_URL"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Verify Godot version
        run: godot --version | grep '^4.7'
      - name: Import project headlessly
        run: godot --headless --editor --path . --quit
      - name: Commit upgrade
        run: |
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add scripts/props/door.gd scripts/actors/ravager.gd scripts/actors/redviper.gd tests/enemy_detection_audit.py
          git commit -m "fix: improve enemy retaliation and door pursuit"
          git push origin main
