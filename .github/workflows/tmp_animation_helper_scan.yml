name: Temporary Acoustic Contract Scan

on:
  push:
    branches:
      - chatgpt/animation-helper-scan-20260903

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Inspect acoustic helper contracts
        shell: bash
        run: |
          set -euo pipefail
          echo '===== METHOD DEFINITIONS / SUPER CALLS ====='
          grep -RIn --include='*.gd' -E 'func (_on_noise_emitted|_alert_nearby_allies)|super\.(_on_noise_emitted|_alert_nearby_allies)' scripts/actors || true
          echo '===== TEST / AUDIT CONTRACTS ====='
          grep -RIn --include='*.py' --include='*.gd' -E '_on_noise_emitted|_alert_nearby_allies|should_hear_noise|has_clear_acoustic_path|is_within_horizontal_range' tests || true
          echo '===== ALLY RADIUS DECLARATIONS / SERIALIZATION ====='
          grep -RIn --include='*.gd' -E 'var ally_alert_radius\b|var hearing_radius\b|var hearing_loudness_scale\b' scripts/actors/enemy_*base.gd || true
          grep -RIn --include='*.tscn' --include='*.tres' -E '^ally_alert_radius\s*=|^hearing_radius\s*=|^hearing_loudness_scale\s*=' scenes resources || true
