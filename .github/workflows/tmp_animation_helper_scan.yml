name: Temporary Animation Offset Scan

on:
  push:
    branches:
      - chatgpt/animation-helper-scan-20260903

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Inspect shared frame offset contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = {
              'combatant': Path('scripts/actors/enemy_combatant_base.gd'),
              'lunge': Path('scripts/actors/enemy_lunge_base.gd'),
              'base': Path('scripts/actors/enemy_base.gd'),
          }
          names = [
              'idle_frame_y_offsets',
              'idle_back_frame_y_offsets',
              'walk_frame_y_offsets',
              'walk_back_frame_y_offsets',
              'attack_frame_y_offsets',
              'death_frame_y_offsets',
          ]
          texts = {k: p.read_text(encoding='utf-8') for k, p in files.items()}
          for name in names:
              print(f'===== {name} =====')
              for family in ('combatant', 'lunge', 'base'):
                  text = texts[family]
                  matches = []
                  for i, line in enumerate(text.splitlines(), 1):
                      if re.search(rf'\bvar\s+{re.escape(name)}\b', line):
                          matches.append((i, line.strip()))
                  print(f'{family}:', matches or '<missing>')
              hits = []
              pattern = re.compile(rf'(?m)^\s*{re.escape(name)}\s*=')
              for path in Path('.').rglob('*'):
                  if '.git' in path.parts or path.suffix not in {'.tscn', '.tres'}:
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  if pattern.search(text):
                      hits.append(str(path))
              print('serialized_hits=', hits)
              print()

          print('===== offset method overrides =====')
          for path in sorted(Path('scripts/actors').glob('*.gd')):
              text = path.read_text(encoding='utf-8')
              if re.search(r'^func _frame_offsets_for_animation\b', text, re.M):
                  print(path)
                  lines = text.splitlines()
                  for i, line in enumerate(lines):
                      if line.startswith('func _frame_offsets_for_animation'):
                          for body_line in lines[i:i+24]:
                              print(body_line)
                          print()
                          break
          PY
