name: Temporary Recover Enemy Visual Callback

on:
  push:
    branches:
      - chatgpt/recover-visual-callback-20260903

permissions:
  contents: write

jobs:
  recover-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore family-owned visual callback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          base_path = Path("scripts/actors/enemy_base.gd")
          combatant_path = Path("scripts/actors/enemy_combatant_base.gd")
          lunge_path = Path("scripts/actors/enemy_lunge_base.gd")
          audit_path = Path("tests/enemy_script_architecture_audit.py")

          def remove_function(source: str, name: str) -> str:
              matches = list(re.finditer(r"(?m)^func\s+([A-Za-z0-9_]+)\b", source))
              target_index = next((i for i, match in enumerate(matches) if match.group(1) == name), None)
              assert target_index is not None, name
              start = matches[target_index].start()
              end = matches[target_index + 1].start() if target_index + 1 < len(matches) else len(source)
              while start > 0 and source[start - 1] == "\n":
                  start -= 1
                  if start == 0 or source[start - 1] != "\n":
                      break
              return source[:start] + "\n\n" + source[end:]

          base = base_path.read_text(encoding="utf-8")
          base = remove_function(base, "_on_visual_frame_changed")
          base_path.write_text(base, encoding="utf-8")

          callback = "func _on_visual_frame_changed() -> void:\n\t_apply_frame_ground_offset()\n\n\n"
          marker = "func _apply_frame_ground_offset() -> void:\n"
          for path in (combatant_path, lunge_path):
              source = path.read_text(encoding="utf-8")
              assert "func _on_visual_frame_changed(" not in source
              assert marker in source
              source = source.replace(marker, callback + marker, 1)
              path.write_text(source, encoding="utf-8")

          audit = audit_path.read_text(encoding="utf-8")
          old = '''assert re.search(r"(?m)^func _on_visual_frame_changed\\b", enemy_base)
          assert not re.search(r"(?m)^func _on_visual_frame_changed\\b", combatant_base)
          assert not re.search(r"(?m)^func _on_visual_frame_changed\\b", lunge_base)
          '''
          old = old.replace("          ", "")
          assert old in audit
          new = '''# Frame callback ailede kalır: base sınıfın aileye özgü _apply_frame_ground_offset
          # hook'unu doğrudan çağırması Godot runtime class-resolution'ını bozar.
          assert not re.search(r"(?m)^func _on_visual_frame_changed\\b", enemy_base)
          assert re.search(r"(?m)^func _on_visual_frame_changed\\b", combatant_base)
          assert re.search(r"(?m)^func _on_visual_frame_changed\\b", lunge_base)
          '''
          new = new.replace("          ", "")
          audit = audit.replace(old, new, 1)
          audit_path.write_text(audit, encoding="utf-8")
          PY
      - name: Run every Python audit
        shell: bash
        run: |
          status=0
          while IFS= read -r audit; do
            echo "::group::$audit"
            python "$audit" || status=1
            echo "::endgroup::"
          done < <(find tests -maxdepth 1 -name '*_audit.py' -print | sort)
          exit "$status"
      - name: Install Godot 4.7
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Clean import and integrity
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -E 'ERROR:|invalid UID' "$RUNNER_TEMP/import.log"; then exit 1; fi
          godot --headless --path . tests/integrity_test.tscn 2>&1 | tee "$RUNNER_TEMP/integrity.log"
          if grep -E 'ERROR:|invalid UID' "$RUNNER_TEMP/integrity.log"; then exit 1; fi
      - name: Commit clean recovery
        shell: bash
        run: |
          rm .github/workflows/tmp_recover_visual_callback.yml
          git config user.name "SerkanAydin06"
          git config user.email "srknydn88@gmail.com"
          git add scripts/actors/enemy_base.gd scripts/actors/enemy_combatant_base.gd scripts/actors/enemy_lunge_base.gd tests/enemy_script_architecture_audit.py .github/workflows/tmp_recover_visual_callback.yml
          git commit -m "Restore family visual frame callback"
          git push origin HEAD:chatgpt/recover-visual-callback-20260903
