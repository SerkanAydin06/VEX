name: Apply Enemy Role AI

on:
  push:
    branches: [main]
    paths:
      - tools/apply_enemy_role_ai.py
      - tools/fix_enemy_role_audits.py
      - .github/workflows/apply_enemy_role_ai.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Apply shared role AI migration
        run: |
          python tools/apply_enemy_role_ai.py
          python tools/fix_enemy_role_audits.py

      - name: Validate role AI contracts
        run: |
          python tests/enemy_role_ai_audit.py
          python tests/enemy_detection_audit.py
          python tests/enemy_runtime_global_path_audit.py
          python tests/crucible_warden_audit.py
          python tests/furnice_carrier_audit.py

      - name: Install Godot 4.7.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Validate Godot 4.7.1 project import
        run: |
          ./Godot_v4.7.1-stable_linux.x86_64 --version
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Commit gameplay changes
        run: |
          git config user.name OpenAI
          git config user.email openai@users.noreply.github.com
          git add \
            scripts/actors/enemy_combat_profiles.gd* \
            scripts/actors/enemy_navigation_runtime.gd* \
            scripts/actors/ravager.gd \
            scripts/actors/redviper.gd \
            scripts/actors/crucible_warden.gd \
            scripts/actors/furnice_carrier.gd \
            scenes/actors/ravager.tscn \
            scenes/actors/veilmaw.tscn \
            scenes/actors/voidweaver.tscn \
            scenes/actors/hellmagma.tscn \
            scenes/actors/furnice_carrier.tscn \
            scenes/actors/crucible_warden.tscn \
            scenes/actors/redviper.tscn \
            scenes/actors/badredviper.tscn \
            scenes/actors/cinderhound.tscn \
            tests/enemy_detection_audit.py \
            tests/enemy_role_ai_audit.py
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: unify enemy combat roles and pursuit'
          git push origin HEAD:main
