name: Apply Hit Impact V1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply_hit_impact_v1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply V1 impact system
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          effect_path = Path('scripts/effects/hit_impact_v1.gd')
          effect_path.parent.mkdir(parents=True, exist_ok=True)
          effect_path.write_text(r'''class_name VexHitImpactV1
          extends Node3D

          const WORLD_TEXTURE_PATH := "res://assets/effects/impacts/impact_world_v1.png"
          const FLESH_TEXTURE_PATH := "res://assets/effects/impacts/impact_flesh_v1.png"
          const MAX_WORLD_IMPACTS := 72
          const MAX_FLESH_IMPACTS := 24


          static func spawn_world(
          	parent: Node,
          	hit_position: Vector3,
          	hit_normal: Vector3,
          	shot_direction: Vector3 = Vector3.ZERO
          ) -> void:
          	if parent == null or not is_instance_valid(parent):
          		return
          	_prune_group(parent, &"vex_world_impacts", MAX_WORLD_IMPACTS)
          	var effect := VexHitImpactV1.new()
          	effect.name = "WorldHitImpactV1"
          	parent.add_child(effect)
          	effect.add_to_group(&"vex_world_impacts")
          	var normal := _safe_normal(hit_normal, -shot_direction)
          	effect.global_position = hit_position + normal * 0.012
          	effect._align_to_normal(normal)
          	effect._build_world_visual()
          	effect._build_particle_burst(
          		Color(0.70, 0.64, 0.55, 1.0),
          		9,
          		0.34,
          		1.4,
          		3.8,
          		0.012,
          		0.032,
          		Vector3(0.0, -5.0, 0.0)
          	)
          	effect._schedule_free(7.0)


          static func spawn_flesh(
          	parent: Node,
          	hit_position: Vector3,
          	hit_normal: Vector3,
          	shot_direction: Vector3 = Vector3.ZERO
          ) -> void:
          	if parent == null or not is_instance_valid(parent):
          		return
          	_prune_group(parent, &"vex_flesh_impacts", MAX_FLESH_IMPACTS)
          	var effect := VexHitImpactV1.new()
          	effect.name = "FleshHitImpactV1"
          	parent.add_child(effect)
          	effect.add_to_group(&"vex_flesh_impacts")
          	var normal := _safe_normal(hit_normal, -shot_direction)
          	effect.global_position = hit_position + normal * 0.025
          	effect._align_to_normal(normal)
          	effect._build_flesh_visual()
          	effect._build_particle_burst(
          		Color(0.42, 0.012, 0.018, 1.0),
          		14,
          		0.48,
          		1.8,
          		4.8,
          		0.018,
          		0.055,
          		Vector3(0.0, -8.5, 0.0)
          	)
          	effect._schedule_free(0.62)


          static func _safe_normal(primary: Vector3, fallback: Vector3) -> Vector3:
          	if primary.length_squared() > 0.000001:
          		return primary.normalized()
          	if fallback.length_squared() > 0.000001:
          		return fallback.normalized()
          	return Vector3.UP


          static func _prune_group(parent: Node, group_name: StringName, limit: int) -> void:
          	var tree := parent.get_tree()
          	if tree == null:
          		return
          	var active := tree.get_nodes_in_group(group_name)
          	while active.size() >= limit:
          		var oldest := active.pop_front() as Node
          		if oldest != null and is_instance_valid(oldest):
          			oldest.queue_free()


          func _align_to_normal(normal: Vector3) -> void:
          	var z_axis := normal.normalized()
          	var helper := Vector3.UP
          	if absf(z_axis.dot(helper)) > 0.96:
          		helper = Vector3.FORWARD
          	var x_axis := helper.cross(z_axis).normalized()
          	var y_axis := z_axis.cross(x_axis).normalized()
          	global_basis = Basis(x_axis, y_axis, z_axis)


          func _build_world_visual() -> void:
          	var mark := MeshInstance3D.new()
          	mark.name = "BulletMark"
          	var quad := QuadMesh.new()
          	quad.size = Vector2(0.12, 0.12)
          	var material := StandardMaterial3D.new()
          	material.shading_mode = BaseMaterial3D.SHADING_MODE_UNSHADED
          	material.cull_mode = BaseMaterial3D.CULL_DISABLED
          	material.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA
          	material.albedo_color = Color(0.055, 0.048, 0.042, 0.92)
          	var texture := _load_optional_texture(WORLD_TEXTURE_PATH)
          	if texture != null:
          		material.albedo_texture = texture
          		material.albedo_color = Color.WHITE
          	quad.material = material
          	mark.mesh = quad
          	add_child(mark)


          func _build_flesh_visual() -> void:
          	var texture := _load_optional_texture(FLESH_TEXTURE_PATH)
          	if texture == null:
          		return
          	var splash := MeshInstance3D.new()
          	splash.name = "FleshSplash"
          	var quad := QuadMesh.new()
          	quad.size = Vector2(0.34, 0.34)
          	var material := StandardMaterial3D.new()
          	material.shading_mode = BaseMaterial3D.SHADING_MODE_UNSHADED
          	material.cull_mode = BaseMaterial3D.CULL_DISABLED
          	material.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA
          	material.billboard_mode = BaseMaterial3D.BILLBOARD_ENABLED
          	material.albedo_texture = texture
          	material.albedo_color = Color.WHITE
          	quad.material = material
          	splash.mesh = quad
          	add_child(splash)


          func _build_particle_burst(
          	color: Color,
          	amount: int,
          	lifetime: float,
          	velocity_min: float,
          	velocity_max: float,
          	scale_min: float,
          	scale_max: float,
          	gravity: Vector3
          ) -> void:
          	var particles := GPUParticles3D.new()
          	particles.name = "Burst"
          	particles.amount = amount
          	particles.lifetime = lifetime
          	particles.one_shot = true
          	particles.explosiveness = 1.0
          	particles.randomness = 0.45
          	particles.local_coords = false

          	var process := ParticleProcessMaterial.new()
          	process.direction = Vector3(0.0, 0.0, 1.0)
          	process.spread = 58.0
          	process.initial_velocity_min = velocity_min
          	process.initial_velocity_max = velocity_max
          	process.gravity = gravity
          	process.scale_min = scale_min
          	process.scale_max = scale_max
          	process.color = color
          	particles.process_material = process

          	var particle_mesh := SphereMesh.new()
          	particle_mesh.radius = 0.018
          	particle_mesh.height = 0.036
          	var particle_material := StandardMaterial3D.new()
          	particle_material.shading_mode = BaseMaterial3D.SHADING_MODE_UNSHADED
          	particle_material.albedo_color = color
          	particle_mesh.material = particle_material
          	particles.draw_pass_1 = particle_mesh

          	add_child(particles)
          	particles.emitting = true
          	particles.restart()


          func _load_optional_texture(path: String) -> Texture2D:
          	if not ResourceLoader.exists(path):
          		return null
          	return ResourceLoader.load(path) as Texture2D


          func _schedule_free(seconds: float) -> void:
          	var timer := Timer.new()
          	timer.one_shot = true
          	timer.wait_time = seconds
          	timer.timeout.connect(queue_free)
          	add_child(timer)
          	timer.start()
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          controller_path = Path('scripts/player/weapon_controller.gd')
          controller = controller_path.read_text(encoding='utf-8')

          if 'const HIT_IMPACT_V1 := preload("res://scripts/effects/hit_impact_v1.gd")' not in controller:
              marker = 'extends Node\n\nsignal loadout_changed\n'
              if marker not in controller:
                  raise SystemExit('weapon_controller header contract changed; refusing unsafe patch')
              controller = controller.replace(
                  marker,
                  'extends Node\n\nconst HIT_IMPACT_V1 := preload("res://scripts/effects/hit_impact_v1.gd")\nconst MAX_WORLD_IMPACTS_PER_TRIGGER := 4\n\nsignal loadout_changed\n',
                  1,
              )

          old_pending = '''\tvar pending_damage: Dictionary = {}\n\tvar pending_hit_positions: Dictionary = {}\n'''
          new_pending = '''\tvar pending_damage: Dictionary = {}\n\tvar pending_hit_positions: Dictionary = {}\n\tvar pending_hit_normals: Dictionary = {}\n\tvar world_impacts_spawned := 0\n'''
          if old_pending not in controller:
              raise SystemExit('pending hit dictionaries contract changed; refusing unsafe patch')
          controller = controller.replace(old_pending, new_pending, 1)

          old_hit = '''\t\t\tvar collider := result.get("collider") as Object\n\t\t\tvar damage_target := _resolve_damage_target(collider)\n\t\t\t# Delme yalnızca canlı/hedef nesneler arasında devam eder. Duvar ve\n\t\t\t# kapılar mermiyi durdurur; böylece arka odalardaki hedefler vurulmaz.\n\t\t\tif damage_target == null:\n\t\t\t\tbreak\n\t\t\tif collider is CollisionObject3D:\n\t\t\t\texclusions.append((collider as CollisionObject3D).get_rid())\n\t\t\tvar hit_position: Vector3 = result.get("position", Vector3.ZERO)\n\t\t\tray_origin = hit_position + direction * 0.05\n'''
          new_hit = '''\t\t\tvar collider := result.get("collider") as Object\n\t\t\tvar damage_target := _resolve_damage_target(collider)\n\t\t\tvar hit_position: Vector3 = result.get("position", Vector3.ZERO)\n\t\t\tvar hit_normal: Vector3 = result.get("normal", -direction)\n\t\t\t# Delme yalnızca canlı/hedef nesneler arasında devam eder. Duvar ve\n\t\t\t# kapılar mermiyi durdurur; böylece arka odalardaki hedefler vurulmaz.\n\t\t\tif damage_target == null:\n\t\t\t\tif world_impacts_spawned < MAX_WORLD_IMPACTS_PER_TRIGGER:\n\t\t\t\t\tHIT_IMPACT_V1.spawn_world(\n\t\t\t\t\t\tget_tree().current_scene,\n\t\t\t\t\t\thit_position,\n\t\t\t\t\t\thit_normal,\n\t\t\t\t\t\tdirection\n\t\t\t\t\t)\n\t\t\t\t\tworld_impacts_spawned += 1\n\t\t\t\tbreak\n\t\t\tif not damage_target.is_in_group("enemy") and world_impacts_spawned < MAX_WORLD_IMPACTS_PER_TRIGGER:\n\t\t\t\tHIT_IMPACT_V1.spawn_world(\n\t\t\t\t\tget_tree().current_scene,\n\t\t\t\t\thit_position,\n\t\t\t\t\thit_normal,\n\t\t\t\t\tdirection\n\t\t\t\t)\n\t\t\t\tworld_impacts_spawned += 1\n\t\t\tif collider is CollisionObject3D:\n\t\t\t\texclusions.append((collider as CollisionObject3D).get_rid())\n\t\t\tray_origin = hit_position + direction * 0.05\n'''
          if old_hit not in controller:
              raise SystemExit('hitscan result contract changed; refusing unsafe patch')
          controller = controller.replace(old_hit, new_hit, 1)

          old_store = '''\t\t\tpending_damage[damage_target] = int(pending_damage.get(damage_target, 0)) + pellet_damage\n\t\t\tpending_hit_positions[damage_target] = hit_position\n\t\t\thit_something = true\n'''
          new_store = '''\t\t\tpending_damage[damage_target] = int(pending_damage.get(damage_target, 0)) + pellet_damage\n\t\t\tpending_hit_positions[damage_target] = hit_position\n\t\t\tpending_hit_normals[damage_target] = hit_normal\n\t\t\thit_something = true\n'''
          if old_store not in controller:
              raise SystemExit('pending damage storage contract changed; refusing unsafe patch')
          controller = controller.replace(old_store, new_store, 1)

          old_damage = '''\t\tdamage_target.call(\n\t\t\t"take_damage",\n\t\t\tint(pending_damage.get(damage_target, 0)),\n\t\t\tpending_hit_positions.get(damage_target, Vector3.ZERO),\n\t\t\t_player\n\t\t)\n'''
          new_damage = '''\t\tvar aggregated_hit_position: Vector3 = pending_hit_positions.get(\n\t\t\tdamage_target,\n\t\t\tVector3.ZERO\n\t\t)\n\t\tdamage_target.call(\n\t\t\t"take_damage",\n\t\t\tint(pending_damage.get(damage_target, 0)),\n\t\t\taggregated_hit_position,\n\t\t\t_player\n\t\t)\n\t\tif damage_target.is_in_group("enemy"):\n\t\t\tHIT_IMPACT_V1.spawn_flesh(\n\t\t\t\tget_tree().current_scene,\n\t\t\t\taggregated_hit_position,\n\t\t\t\tpending_hit_normals.get(damage_target, Vector3.UP),\n\t\t\t\t_player.get_view_camera().global_basis * Vector3.FORWARD\n\t\t\t)\n'''
          if old_damage not in controller:
              raise SystemExit('aggregated take_damage contract changed; refusing unsafe patch')
          controller = controller.replace(old_damage, new_damage, 1)
          controller_path.write_text(controller, encoding='utf-8')

          audit_path = Path('tests/hit_impact_audit.py')
          audit_path.write_text(r'''#!/usr/bin/env python3
          from pathlib import Path
          import sys

          ROOT = Path(__file__).resolve().parents[1]
          errors: list[str] = []

          def read(path: str) -> str:
              full = ROOT / path
              if not full.exists():
                  errors.append(f"Eksik impact V1 dosyası: {path}")
                  return ""
              return full.read_text(encoding="utf-8")

          effect = read("scripts/effects/hit_impact_v1.gd")
          controller = read("scripts/player/weapon_controller.gd")

          for needle in [
              "class_name VexHitImpactV1",
              'WORLD_TEXTURE_PATH := "res://assets/effects/impacts/impact_world_v1.png"',
              'FLESH_TEXTURE_PATH := "res://assets/effects/impacts/impact_flesh_v1.png"',
              "func spawn_world(",
              "func spawn_flesh(",
              "GPUParticles3D.new()",
              'add_to_group(&"vex_world_impacts")',
              'add_to_group(&"vex_flesh_impacts")',
              "MAX_WORLD_IMPACTS := 72",
              "MAX_FLESH_IMPACTS := 24",
              "ResourceLoader.exists(path)",
          ]:
              if needle not in effect:
                  errors.append(f"Impact effect sözleşmesi eksik: {needle}")

          for needle in [
              'preload("res://scripts/effects/hit_impact_v1.gd")',
              "MAX_WORLD_IMPACTS_PER_TRIGGER := 4",
              'result.get("normal", -direction)',
              "pending_hit_normals",
              "HIT_IMPACT_V1.spawn_world(",
              "HIT_IMPACT_V1.spawn_flesh(",
              'damage_target.is_in_group("enemy")',
          ]:
              if needle not in controller:
                  errors.append(f"WeaponController impact sözleşmesi eksik: {needle}")

          if errors:
              print("HIT IMPACT V1 AUDIT FAILED:")
              for error in errors:
                  print(" -", error)
              sys.exit(1)
          print("HIT IMPACT V1 AUDIT OK")
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          validate_path = Path('.github/workflows/validate.yml')
          validate = validate_path.read_text(encoding='utf-8')
          marker = '      - name: Validate weapon ADS targeting\n        run: python tests/weapon_ads_audit.py\n'
          addition = marker + '      - name: Validate hit impact V1\n        run: python tests/hit_impact_audit.py\n'
          if 'Validate hit impact V1' not in validate:
              if marker not in validate:
                  raise SystemExit('validate workflow marker changed; refusing unsafe patch')
              validate = validate.replace(marker, addition, 1)
              validate_path.write_text(validate, encoding='utf-8')
          PY

          git diff --check

      - name: Run impact and existing audits
        run: |
          python -m py_compile tests/hit_impact_audit.py
          python tests/hit_impact_audit.py
          python tests/static_audit.py
          python tests/scene_syntax_audit.py
          python tests/level_test_audit.py
          python tests/player_movement_audit.py
          python tests/furnice_carrier_audit.py
          python tests/crucible_warden_audit.py
          python tests/sg04_weapon_audit.py
          python tests/weapon_ads_audit.py

      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add scripts/effects/hit_impact_v1.gd scripts/player/weapon_controller.gd tests/hit_impact_audit.py .github/workflows/validate.yml
          git commit -m "feat: add hit impact V1"
          git push origin HEAD:main
