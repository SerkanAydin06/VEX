name: Apply Hit Impact V1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply_hit_impact_v1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch weapon hit routing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          controller_path = Path('scripts/player/weapon_controller.gd')
          controller = controller_path.read_text(encoding='utf-8')

          header = 'extends Node\n\nsignal loadout_changed\n'
          replacement = 'extends Node\n\nconst HIT_IMPACT_V1 := preload("res://scripts/effects/hit_impact_v1.gd")\nconst MAX_WORLD_IMPACTS_PER_TRIGGER := 4\n\nsignal loadout_changed\n'
          if 'const HIT_IMPACT_V1 :=' not in controller:
              if header not in controller:
                  raise SystemExit('weapon_controller header contract changed')
              controller = controller.replace(header, replacement, 1)

          old_pending = '\tvar pending_damage: Dictionary = {}\n\tvar pending_hit_positions: Dictionary = {}\n'
          new_pending = '\tvar pending_damage: Dictionary = {}\n\tvar pending_hit_positions: Dictionary = {}\n\tvar pending_hit_normals: Dictionary = {}\n\tvar world_impacts_spawned := 0\n'
          if old_pending not in controller:
              raise SystemExit('pending hit contract changed')
          controller = controller.replace(old_pending, new_pending, 1)

          old_hit = '''\t\t\tvar collider := result.get("collider") as Object
          \t\t\tvar damage_target := _resolve_damage_target(collider)
          \t\t\t# Delme yalnızca canlı/hedef nesneler arasında devam eder. Duvar ve
          \t\t\t# kapılar mermiyi durdurur; böylece arka odalardaki hedefler vurulmaz.
          \t\t\tif damage_target == null:
          \t\t\t\tbreak
          \t\t\tif collider is CollisionObject3D:
          \t\t\t\texclusions.append((collider as CollisionObject3D).get_rid())
          \t\t\tvar hit_position: Vector3 = result.get("position", Vector3.ZERO)
          \t\t\tray_origin = hit_position + direction * 0.05
          '''.replace('\n          ', '\n')
          new_hit = '''\t\t\tvar collider := result.get("collider") as Object
          \t\t\tvar damage_target := _resolve_damage_target(collider)
          \t\t\tvar hit_position: Vector3 = result.get("position", Vector3.ZERO)
          \t\t\tvar hit_normal: Vector3 = result.get("normal", -direction)
          \t\t\t# Delme yalnızca canlı/hedef nesneler arasında devam eder. Duvar ve
          \t\t\t# kapılar mermiyi durdurur; böylece arka odalardaki hedefler vurulmaz.
          \t\t\tif damage_target == null:
          \t\t\t\tif world_impacts_spawned < MAX_WORLD_IMPACTS_PER_TRIGGER:
          \t\t\t\t\tHIT_IMPACT_V1.spawn_world(
          \t\t\t\t\t\tget_tree().current_scene,
          \t\t\t\t\t\thit_position,
          \t\t\t\t\t\thit_normal,
          \t\t\t\t\t\tdirection
          \t\t\t\t\t)
          \t\t\t\t\tworld_impacts_spawned += 1
          \t\t\t\tbreak
          \t\t\tif not damage_target.is_in_group("enemy") and world_impacts_spawned < MAX_WORLD_IMPACTS_PER_TRIGGER:
          \t\t\t\tHIT_IMPACT_V1.spawn_world(
          \t\t\t\t\tget_tree().current_scene,
          \t\t\t\t\thit_position,
          \t\t\t\t\thit_normal,
          \t\t\t\t\tdirection
          \t\t\t\t)
          \t\t\t\tworld_impacts_spawned += 1
          \t\t\tif collider is CollisionObject3D:
          \t\t\t\texclusions.append((collider as CollisionObject3D).get_rid())
          \t\t\tray_origin = hit_position + direction * 0.05
          '''.replace('\n          ', '\n')
          if old_hit not in controller:
              raise SystemExit('hitscan result contract changed')
          controller = controller.replace(old_hit, new_hit, 1)

          old_store = '\t\t\tpending_damage[damage_target] = int(pending_damage.get(damage_target, 0)) + pellet_damage\n\t\t\tpending_hit_positions[damage_target] = hit_position\n\t\t\thit_something = true\n'
          new_store = '\t\t\tpending_damage[damage_target] = int(pending_damage.get(damage_target, 0)) + pellet_damage\n\t\t\tpending_hit_positions[damage_target] = hit_position\n\t\t\tpending_hit_normals[damage_target] = hit_normal\n\t\t\thit_something = true\n'
          if old_store not in controller:
              raise SystemExit('pending damage storage contract changed')
          controller = controller.replace(old_store, new_store, 1)

          old_damage = '''\t\tdamage_target.call(
          \t\t\t"take_damage",
          \t\t\tint(pending_damage.get(damage_target, 0)),
          \t\t\tpending_hit_positions.get(damage_target, Vector3.ZERO),
          \t\t\t_player
          \t\t)
          '''.replace('\n          ', '\n')
          new_damage = '''\t\tvar aggregated_hit_position: Vector3 = pending_hit_positions.get(
          \t\t\tdamage_target,
          \t\t\tVector3.ZERO
          \t\t)
          \t\tdamage_target.call(
          \t\t\t"take_damage",
          \t\t\tint(pending_damage.get(damage_target, 0)),
          \t\t\taggregated_hit_position,
          \t\t\t_player
          \t\t)
          \t\tif damage_target.is_in_group("enemy"):
          \t\t\tHIT_IMPACT_V1.spawn_flesh(
          \t\t\t\tget_tree().current_scene,
          \t\t\t\taggregated_hit_position,
          \t\t\t\tpending_hit_normals.get(damage_target, Vector3.UP),
          \t\t\t\tVector3.ZERO
          \t\t\t)
          '''.replace('\n          ', '\n')
          if old_damage not in controller:
              raise SystemExit('aggregated damage contract changed')
          controller = controller.replace(old_damage, new_damage, 1)
          controller_path.write_text(controller, encoding='utf-8')

          audit = '''#!/usr/bin/env python3
          from pathlib import Path
          import sys

          ROOT = Path(__file__).resolve().parents[1]
          errors = []

          def read(path):
              full = ROOT / path
              if not full.exists():
                  errors.append(f"Eksik impact V1 dosyası: {path}")
                  return ""
              return full.read_text(encoding="utf-8")

          effect = read("scripts/effects/hit_impact_v1.gd")
          controller = read("scripts/player/weapon_controller.gd")

          for needle in [
              "class_name VexHitImpactV1",
              "impact_world_v1.png",
              "impact_flesh_v1.png",
              "func spawn_world(",
              "func spawn_flesh(",
              "GPUParticles3D.new()",
              "MAX_WORLD_IMPACTS := 72",
              "MAX_FLESH_IMPACTS := 24",
              "ResourceLoader.exists(path)",
          ]:
              if needle not in effect:
                  errors.append(f"Impact effect sözleşmesi eksik: {needle}")

          for needle in [
              'preload("res://scripts/effects/hit_impact_v1.gd")',
              "MAX_WORLD_IMPACTS_PER_TRIGGER := 4",
              'result.get("normal", -direction)',
              "pending_hit_normals",
              "HIT_IMPACT_V1.spawn_world(",
              "HIT_IMPACT_V1.spawn_flesh(",
              'damage_target.is_in_group("enemy")',
          ]:
              if needle not in controller:
                  errors.append(f"WeaponController impact sözleşmesi eksik: {needle}")

          if errors:
              print("HIT IMPACT V1 AUDIT FAILED:")
              for error in errors:
                  print(" -", error)
              sys.exit(1)
          print("HIT IMPACT V1 AUDIT OK")
          '''.replace('\n          ', '\n').lstrip()
          Path('tests/hit_impact_audit.py').write_text(audit, encoding='utf-8')
          PY
          git diff --check

      - name: Run audits
        run: |
          python -m py_compile tests/hit_impact_audit.py
          python tests/hit_impact_audit.py
          python tests/static_audit.py
          python tests/scene_syntax_audit.py
          python tests/level_test_audit.py
          python tests/player_movement_audit.py
          python tests/furnice_carrier_audit.py
          python tests/crucible_warden_audit.py
          python tests/sg04_weapon_audit.py
          python tests/weapon_ads_audit.py

      - name: Commit directly to main
        run: |
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add scripts/player/weapon_controller.gd tests/hit_impact_audit.py
          git commit -m "feat: wire hit impact V1"
          git push origin HEAD:main
