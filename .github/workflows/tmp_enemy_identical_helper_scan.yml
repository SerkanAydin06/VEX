name: Temporary Combatant Technical Export Scan

on:
  push:
    branches:
      - chatgpt/enemy-identical-helper-scan-20260903

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan all detour and cover export overrides
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          combatant = Path("scripts/actors/enemy_combatant_base.gd").read_text(encoding="utf-8")
          candidates = []
          for line in combatant.splitlines():
              if "@export" not in line or ("detour" not in line and "cover" not in line):
                  continue
              match = re.search(r"\bvar\s+([A-Za-z0-9_]+)", line)
              if match:
                  candidates.append(match.group(1))

          serialized = []
          for root in [Path("scenes"), Path("resources")]:
              if not root.exists():
                  continue
              for suffix in ("*.tscn", "*.tres"):
                  for path in root.rglob(suffix):
                      try:
                          serialized.append((path, path.read_text(encoding="utf-8")))
                      except UnicodeDecodeError:
                          pass

          print("===== DETOUR/COVER EXPORTED CANDIDATES =====")
          for name in sorted(set(candidates)):
              hits = []
              pattern = re.compile(rf"(?m)^\s*{re.escape(name)}\s*=")
              for path, text in serialized:
                  if pattern.search(text):
                      hits.append(str(path))
              print(f"{name}: overrides={len(hits)}")
              for hit in hits:
                  print(f"  {hit}")
          PY
