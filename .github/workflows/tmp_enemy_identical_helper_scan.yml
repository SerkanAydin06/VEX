name: Temporary Combatant Technical Export Scan

on:
  push:
    branches:
      - chatgpt/enemy-identical-helper-scan-20260903

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan detour and cover export overrides
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          combatant = Path("scripts/actors/enemy_combatant_base.gd").read_text(encoding="utf-8")
          candidates = []
          for match in re.finditer(r"(?m)^@export(?:_[^\n]*)?[^\n]*\n(?:#.*\n)*var\s+([A-Za-z0-9_]+)", combatant):
              name = match.group(1)
              if "detour" in name or "cover" in name:
                  candidates.append(name)

          serialized = []
          for path in list(Path("scenes").rglob("*.tscn")) + list(Path("resources").rglob("*.tres")):
              try:
                  serialized.append((path, path.read_text(encoding="utf-8")))
              except UnicodeDecodeError:
                  pass

          print("===== DETOUR/COVER EXPORTED CANDIDATES =====")
          for name in sorted(set(candidates)):
              hits = []
              pattern = re.compile(rf"(?m)^\s*{re.escape(name)}\s*=")
              for path, text in serialized:
                  if pattern.search(text):
                      hits.append(str(path))
              print(f"{name}: overrides={len(hits)}")
              for hit in hits:
                  print(f"  {hit}")

          print("===== SOURCE LINES =====")
          for i, line in enumerate(combatant.splitlines(), 1):
              if ("detour" in line or "cover" in line) and ("@export" in line or "var " in line):
                  print(f"{i}: {line}")
          PY
