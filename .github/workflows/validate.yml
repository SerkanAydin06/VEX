name: Validate VEX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run VEX static audit
        run: python tests/static_audit.py
      - name: Validate scene root syntax
        run: python tests/scene_syntax_audit.py
      - name: Validate Level Test arena
        run: python tests/level_test_audit.py
      - name: Validate player movement
        run: python tests/player_movement_audit.py
      - name: Validate Furnice Carrier
        run: python tests/furnice_carrier_audit.py
      - name: Validate SG04 weapon
        run: python tests/sg04_weapon_audit.py
      - name: Validate weapon ADS targeting
        run: python tests/weapon_ads_audit.py
