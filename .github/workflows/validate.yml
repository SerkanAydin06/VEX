name: Validate VEX

on:
  push:
    branches: [main, "tmp/pistol-visual-audit-20260827"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run VEX static audit
        run: python tests/static_audit.py
      - name: Validate scene root syntax
        run: python tests/scene_syntax_audit.py
      - name: Validate Level Test arena
        run: python tests/level_test_audit.py
      - name: Validate weapon ADS targeting
        run: python tests/weapon_ads_audit.py
      - name: Install visual audit dependency
        run: python -m pip install pillow
      - name: Audit pistol visual frames
        run: python tests/pistol_visual_probe.py
      - name: Build pistol runtime sheets
        if: always()
        run: python tests/pistol_runtime_sheet.py
      - name: Upload pistol contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pistol-contact-sheets
          path: /tmp/pistol_visual_audit/*.jpg
