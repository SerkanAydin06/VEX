      - name: Install Windows export templates
        env:
          TEMPLATE_URL: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/templates.tpz" "$TEMPLATE_URL"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/export-templates"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv "$RUNNER_TEMP/export-templates/templates" "$HOME/.local/share/godot/export_templates/4.7.stable"
      - name: Smoke-test Windows release export
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/windows
          log="$RUNNER_TEMP/windows-export.log"
          godot --headless --path . --export-release "Windows Desktop" build/windows/VEX.exe 2>&1 | tee "$log"
          test -s build/windows/VEX.exe
          if grep -E 'ERROR:|invalid UID' "$log"; then
            echo "::error::Windows export log contains an error or invalid UID"
            exit 1
          fi
