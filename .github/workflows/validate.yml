name: Validate VEX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run every Python audit
        shell: bash
        run: |
          status=0
          while IFS= read -r audit; do
            echo "::group::$audit"
            python "$audit" || status=1
            echo "::endgroup::"
          done < <(find tests -maxdepth 1 -name '*_audit.py' -print | sort)
          exit "$status"

  godot-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install official Godot 4.7
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" "$GODOT_URL"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Verify Godot version
        run: godot --version | grep '^4.7'
      - name: Import project headlessly
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/godot-import.log"
          godot --headless --editor --path . --quit 2>&1 | tee "$log"
          if grep -E 'ERROR:|invalid UID' "$log"; then
            echo "::error::Godot clean import log contains an error or invalid UID"
            exit 1
          fi
      - name: Run Godot integrity scene
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/godot-integrity.log"
          godot --headless --path . tests/integrity_test.tscn 2>&1 | tee "$log"
          if grep -E 'ERROR:|invalid UID' "$log"; then
            echo "::error::Godot integrity log contains an error or invalid UID"
            exit 1
          fi
      - name: Run player movement runtime regression
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/player-movement-runtime.log"
          godot --headless --path . tests/player_movement_runtime_test.tscn 2>&1 | tee "$log"
