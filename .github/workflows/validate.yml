name: Validate VEX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run VEX static audit
        run: python tests/static_audit.py
      - name: Validate scene root syntax
        run: python tests/scene_syntax_audit.py
      - name: Validate Level Test arena
        run: python tests/level_test_audit.py
      - name: Validate player movement
        run: python tests/player_movement_audit.py
      - name: Validate Furnice Carrier
        run: python tests/furnice_carrier_audit.py
      - name: Validate SG04 weapon
        run: python tests/sg04_weapon_audit.py
      - name: Validate weapon ADS targeting
        run: python tests/weapon_ads_audit.py
      - name: Install official Godot 4.7
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" "$GODOT_URL"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Verify Godot version
        run: godot --version | grep '^4.7'
      - name: Import project headlessly
        run: godot --headless --editor --path . --quit
      - name: Run Godot integrity scene
        run: godot --headless --path . tests/integrity_test.tscn
