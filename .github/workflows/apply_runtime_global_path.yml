name: Apply Runtime Global Path

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply_runtime_global_path.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Apply runtime global path
        run: python .github/fix_runtime_global_path.py
      - name: Run global path audit
        run: python tests/enemy_runtime_global_path_audit.py
      - name: Install Godot 4.7
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q Godot_v4.7-stable_linux.x86_64.zip
          chmod +x Godot_v4.7-stable_linux.x86_64
      - name: Validate Godot scripts
        run: |
          ./Godot_v4.7-stable_linux.x86_64 --version
          ./Godot_v4.7-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Commit gameplay fix
        run: |
          git config user.name OpenAI
          git config user.email openai@users.noreply.github.com
          git add scripts/actors/ravager.gd scripts/actors/crucible_warden.gd tests/enemy_runtime_global_path_audit.py
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add runtime shortest-path enemy pursuit'
          git push origin HEAD:main
