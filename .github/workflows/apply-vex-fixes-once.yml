name: Apply VEX fixes once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-vex-fixes-once.yml"

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply audited fixes
        shell: bash
        run: |
          python - <<'PY'
          import base64
          exec(base64.b64decode("...<truncated>..."), encoding="utf-8")
          PY
      - name: Run Python audits before commit
        shell: bash
        run: |
          status=0
          while IFS= read -r audit; do
            echo "::group::$audit"
            python "$audit" || status=1
            echo "::endgroup::"
          done < <(find tests -maxdepth 1 -name '*_audit.py' -print | sort)
          exit "$status"
      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-vex-fixes-once.yml
          git add scripts/player/weapon_controller.gd scripts/player/player.gd scripts/autoload/game_state.gd scripts/levels/base_level.gd Enemies_VEX.md tests/static_audit.py tests/weapon_pause_reload_runtime_test.gd tests/weapon_pause_reload_runtime_test.tscn .github/workflows/validate.yml
          git diff --cached --check
          git commit -m "Fix pause reload and sync player contracts"
          git push origin HEAD:main
