name: Fix Ravager Warning

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename shadowing variable
        run: |
          sed -i 's/var visible := VexEnemyRuntimeUtils.has_visual_contact(/var has_contact := VexEnemyRuntimeUtils.has_visual_contact(/' scripts/actors/ravager.gd
          sed -i 's/1.0 if visible else 0.0/1.0 if has_contact else 0.0/' scripts/actors/ravager.gd
          sed -i 's/^\treturn visible$/\treturn has_contact/' scripts/actors/ravager.gd
          ! grep -q 'var visible :=' scripts/actors/ravager.gd
      - name: Commit when changed
        run: |
          git config user.name OpenAI
          git config user.email openai@users.noreply.github.com
          git add scripts/actors/ravager.gd
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: avoid Node3D visible shadow warning'
          git push origin HEAD:main
