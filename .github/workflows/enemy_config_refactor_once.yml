name: Enemy Config Refactor Once

on:
  push:
    branches:
      - chatgpt/enemy-config-dedupe-20260903

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply focused refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          combatant_path = root / 'scripts/actors/enemy_combatant_base.gd'
          lunge_path = root / 'scripts/actors/enemy_lunge_base.gd'
          base_path = root / 'scripts/actors/enemy_base.gd'
          architecture_path = root / 'tests/enemy_script_architecture_audit.py'
          inspector_path = root / 'tests/enemy_inspector_documentation_audit.py'

          difficulty_block = '''
          @export_category("01B - Zorluk Çarpanları (Sahne)")
          ## zorluk can çarpanları; dizi sırası Kolay, Normal, Zor ve Kabus seviyeleridir.
          @export var difficulty_health_multipliers := PackedFloat32Array([0.75, 1.0, 1.20, 1.45])
          ## zorluk hasar çarpanları; dizi sırası Kolay, Normal, Zor ve Kabus seviyeleridir.
          @export var difficulty_damage_multipliers := PackedFloat32Array([0.65, 1.0, 1.25, 1.55])
          ## zorluk hız çarpanları; dizi sırası Kolay, Normal, Zor ve Kabus seviyeleridir.
          @export var difficulty_speed_multipliers := PackedFloat32Array([0.90, 1.0, 1.08, 1.15])
          ## zorluk algılama çarpanları; dizi sırası Kolay, Normal, Zor ve Kabus seviyeleridir.
          @export var difficulty_detection_multipliers := PackedFloat32Array([0.90, 1.0, 1.08, 1.20])
          ## zorluk bekleme çarpanları; dizi sırası Kolay, Normal, Zor ve Kabus seviyeleridir.
          @export var difficulty_cooldown_multipliers := PackedFloat32Array([1.25, 1.0, 0.85, 0.70])
          ## zorluk hazırlık çarpanları; dizi sırası Kolay, Normal, Zor ve Kabus seviyeleridir.
          @export var difficulty_windup_multipliers := PackedFloat32Array([1.20, 1.0, 0.90, 0.75])
          '''.strip()

          base = base_path.read_text(encoding='utf-8')
          anchor = 'const EnemyCombatRuntime = preload("res://scripts/actors/enemy_combat_runtime.gd")\n'
          assert difficulty_block not in base, 'difficulty block already exists in enemy_base'
          assert base.count(anchor) == 1, 'enemy_base insertion anchor changed'
          base = base.replace(anchor, anchor + '\n' + difficulty_block + '\n', 1)
          base_path.write_text(base, encoding='utf-8')

          block_pattern = re.compile(
              r'\n@export_category\("01B - Zorluk Çarpanları \(Sahne\)"\)\n'
              r'(?:## [^\n]+\n@export[^\n]+\n){6}'
          )
          for path in (combatant_path, lunge_path):
              source = path.read_text(encoding='utf-8')
              source, count = block_pattern.subn('\n', source, count=1)
              assert count == 1, f'{path}: shared difficulty block was not removed exactly once'
              path.write_text(source, encoding='utf-8')

          architecture = architecture_path.read_text(encoding='utf-8')
          old_architecture = '''for shared_setting in [
              "enemy_id",
              "combat_role",
              "maximum_health",
              "spawn_min_difficulty",
              "apply_difficulty_scaling",
              "difficulty_health_multipliers",
              "difficulty_damage_multipliers",
              "difficulty_speed_multipliers",
              "difficulty_detection_multipliers",
              "difficulty_cooldown_multipliers",
              "difficulty_windup_multipliers",
          ]:
              assert not re.search(rf"@export[^\\n]*\\bvar {shared_setting}\\b", enemy_base), shared_setting
              assert re.search(rf"@export[^\\n]*\\bvar {shared_setting}\\b", combatant_base), shared_setting
              assert re.search(rf"@export[^\\n]*\\bvar {shared_setting}\\b", lunge_base), shared_setting

          assert "@export" not in enemy_base
          '''
          new_architecture = '''for subclass_setting in [
              "enemy_id",
              "combat_role",
              "maximum_health",
              "spawn_min_difficulty",
              "apply_difficulty_scaling",
          ]:
              assert not re.search(rf"@export[^\\n]*\\bvar {subclass_setting}\\b", enemy_base), subclass_setting
              assert re.search(rf"@export[^\\n]*\\bvar {subclass_setting}\\b", combatant_base), subclass_setting
              assert re.search(rf"@export[^\\n]*\\bvar {subclass_setting}\\b", lunge_base), subclass_setting

          for shared_difficulty_setting in [
              "difficulty_health_multipliers",
              "difficulty_damage_multipliers",
              "difficulty_speed_multipliers",
              "difficulty_detection_multipliers",
              "difficulty_cooldown_multipliers",
              "difficulty_windup_multipliers",
          ]:
              assert re.search(
                  rf"@export[^\\n]*\\bvar {shared_difficulty_setting}\\b",
                  enemy_base,
              ), shared_difficulty_setting
              assert not re.search(
                  rf"@export[^\\n]*\\bvar {shared_difficulty_setting}\\b",
                  combatant_base,
              ), shared_difficulty_setting
              assert not re.search(
                  rf"@export[^\\n]*\\bvar {shared_difficulty_setting}\\b",
                  lunge_base,
              ), shared_difficulty_setting

          assert enemy_base.count('@export_category("01B - Zorluk Çarpanları (Sahne)")') == 1
          '''
          assert architecture.count(old_architecture) == 1, 'architecture audit ownership block changed'
          architecture = architecture.replace(old_architecture, new_architecture, 1)
          architecture_path.write_text(architecture, encoding='utf-8')

          inspector = inspector_path.read_text(encoding='utf-8')
          category_line = '        "01B - Zorluk Çarpanları (Sahne)",\n'
          assert inspector.count(category_line) == 2, 'Inspector subclass schema changed'
          inspector = inspector.replace(category_line, '')
          documented_anchor = 'DOCUMENTED_EXPORT_FILES = [\n'
          assert inspector.count(documented_anchor) == 1
          inspector = inspector.replace(
              documented_anchor,
              documented_anchor + '    "enemy_base.gd",\n',
              1,
          )
          old_base_assert = '''enemy_base = read("enemy_base.gd")
          assert "@export" not in enemy_base, "enemy_base görünür Inspector sırasını yeniden bozar"
          '''
          new_base_assert = '''enemy_base = read("enemy_base.gd")
          assert re.findall(r'@export_category\\("([^\"]+)"\\)', enemy_base) == [
              "01B - Zorluk Çarpanları (Sahne)"
          ], "enemy_base yalnız ortak zorluk tuning kategorisini sahiplenmeli"
          '''
          assert inspector.count(old_base_assert) == 1, 'enemy_base Inspector audit contract changed'
          inspector = inspector.replace(old_base_assert, new_base_assert, 1)
          inspector_path.write_text(inspector, encoding='utf-8')

          workflow = root / '.github/workflows/enemy_config_refactor_once.yml'
          assert workflow.exists()
          workflow.unlink()
          PY

      - name: Run every Python audit
        shell: bash
        run: |
          status=0
          while IFS= read -r audit; do
            echo "::group::$audit"
            python "$audit" || status=1
            echo "::endgroup::"
          done < <(find tests -maxdepth 1 -name '*_audit.py' -print | sort)
          exit "$status"

      - name: Verify patch scope
        shell: bash
        run: |
          git diff --check
          git status --short
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/enemy_config_refactor_once.yml' \
            'scripts/actors/enemy_base.gd' \
            'scripts/actors/enemy_combatant_base.gd' \
            'scripts/actors/enemy_lunge_base.gd' \
            'tests/enemy_inspector_documentation_audit.py' \
            'tests/enemy_script_architecture_audit.py' | sort)"
          test "$changed" = "$expected"

      - name: Commit focused refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Centralize shared enemy difficulty tuning"
          git push origin HEAD:${{ github.ref_name }}
