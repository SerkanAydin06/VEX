name: Fix Ravager Position Shadow

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix_ravager_position_shadow.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Rename shadowing parameter
        run: |
          sed -i 's/func _has_navigation_floor(position: Vector3)/func _has_navigation_floor(probe_position: Vector3)/' scripts/actors/ravager.gd
          sed -i '/func _has_navigation_floor(probe_position: Vector3)/,+2 s/position +/probe_position +/g' scripts/actors/ravager.gd
          grep -F 'func _has_navigation_floor(probe_position: Vector3) -> bool:' scripts/actors/ravager.gd
          ! grep -F 'func _has_navigation_floor(position: Vector3)' scripts/actors/ravager.gd
      - name: Commit fix
        run: |
          git config user.name OpenAI
          git config user.email openai@users.noreply.github.com
          git add scripts/actors/ravager.gd
          git commit -m 'fix: avoid Node3D position shadow warning'
          git push origin HEAD:main
